# ===========================================================================
#  NeoModeration
#  Chat + map-art moderation for Minecraft.
#
#  Most settings can also be changed in-game with /nmod (no restart needed).
#  Run "/nmod status" any time to see what is currently active.
# ===========================================================================

# Language file to use from the /locale folder (en_US, es_ES, fr_FR, de_DE, pt_BR, tr_TR, or your own).
locale: "en_US"

# Check GitHub once at startup for a newer NeoModeration and log one line if
# there is one. Sends nothing about your server and never downloads anything.
# Word-list moderation ages badly, so an old install quietly misses more.
updateCheck: true

moderation:
  # Master switch. When false, NeoModeration does nothing.
  enabled: true

  # How detections are handled:
  #   monitor = detect, alert staff, and count what WOULD happen, but never
  #             block a message or punish a player. Great for evaluating.
  #   enforce = block flagged content and run the actions configured below.
  #
  # This is the mode for LOCAL rules: the word and URL lists below, and
  # anti-spam. The bundled starter list blocks matching messages straight
  # away, but it does not punish players or clear everyone else's chat. Review
  # the list for your server's standards. Switch back any time with
  # /nmod mode monitor.
  mode: "enforce"

  # The same setting for CLOUD decisions, which are judgements made by a model
  # rather than a list you wrote. A new install only ALERTS on these until you
  # have watched it decide for a while, then run:  /nmod cloudmode enforce
  # Remove this key entirely to make cloud decisions follow "mode" above.
  cloudMode: "monitor"

  # ---- Local rules (no API key required, evaluate instantly) --------------
  offline:
    enabled: true
    # Block ANY url, not just the ones listed in bannedUrls.
    blockAnyUrl: false
    # Treat "b4dw0rd" style spellings as their plain-text equivalent.
    normalizeLeetspeak: true
    # A starter English policy so a new install blocks real abuse immediately.
    # You should still review and extend it for your server's own standards.
    # Manage the list in-game with /nmod ban and /nmod allow.
    # Matching is whole-word, so "assignment" and "Scunthorpe" stay clean;
    # inflections are listed explicitly rather than matched as prefixes.
    # "badword" is kept so the documented check /nmod test badword still works.
    bannedWords:
      - "badword"
      - "scam"
      - "fuck"
      - "fucks"
      - "fucked"
      - "fucking"
      - "fucker"
      - "fuckers"
      - "motherfucker"
      - "motherfuckers"
      - "shit"
      - "shits"
      - "shitty"
      - "bullshit"
      - "bitch"
      - "bitches"
      - "cunt"
      - "cunts"
      - "asshole"
      - "assholes"
      - "bastard"
      - "bastards"
      - "dickhead"
      - "whore"
      - "whores"
      - "slut"
      - "sluts"
      - "nigger"
      - "niggers"
      - "nigga"
      - "niggas"
      - "faggot"
      - "faggots"
      - "retard"
      - "retarded"
      - "wanker"
      - "twat"
      - "kys"
    bannedUrls:
      - "grabify.link"
      - "iplogger.org"
      - "2no.co"
      - "yip.su"
      - "blasze.com"
      - "curiouscat.club"
      - "ps3cfw.com"
      - "discord.gg/free"
      - "discord-nitro"
      - "discordnitro"
      - "discord.gift"
      - "free-nitro"
      - "hypixel-giveaway"
      - "minecon-cape"
      - "minecon-capes"
      - "optifine-cape"
      - "steamcommunity.link"
    # Exceptions that always win over the rules above (manage with /nmod allow).
    # allowedWords are whole phrases: a banned word inside an allowed phrase is
    # ignored. allowedUrls are substring matches, exactly like bannedUrls, and
    # also exempt matching links from blockAnyUrl.
    allowedWords: []
    allowedUrls: []

  # ---- Cloud moderation (requires a Neomechanical API key) -----------------
  # Run "/nmod trial" in-game or from console to activate a free 14-day cloud
  # evaluation with zero browser steps. Or sign up at
  # https://neomechanical.com/signup?src=neomoderation, create a key with
  # events:write + usage:read, then run:  /nmod setup <apiKey>
  # Verify authentication and credits with /nmod doctor. If credits reach zero,
  # recover at https://neomechanical.com/billing?src=neomoderation_credits.
  api:
    endpoint: "https://api.neomechanical.com/v1/events"
    apiKey: ""
    # Chat never waits more than ~2.5s total for the cloud, regardless of these
    # values; raise them only if your network genuinely needs it.
    connectTimeoutMs: 2000
    readTimeoutMs: 2000

  # Which content categories the cloud should flag. Ignored when no API key
  # is set. Each category accepts:
  #   true  = on at the default sensitivity (0.7)
  #   false = off
  #   0.05 - 0.99 = custom score threshold (lower = stricter)
  # Or apply a bundle with /nmod preset <family|community|minimal>.
  categories:
    sexual: true
    hate: true
    harassment: true
    violence: true
    scam: true
    spam: true
    illicit: true
    selfHarm: true

  # ---- Map art (filled maps) scanning -------------------------------------
  # Scans filled maps for NSFW imagery via the cloud. Requires an API key.
  # Results are cached per map so each map is only scanned once.
  mapArt:
    enabled: true
    # Scan when a player scrolls to / holds a filled map.
    scanOnHold: true
    # Scan when a player right-clicks an item frame holding a map.
    scanOnFrameInteract: true
    # Remove the map from the player when it is flagged. When false the player
    # is warned but keeps the item.
    confiscate: true
    # How many map results to remember (safe + flagged) before old ones drop.
    cacheSize: 1000

  # ---- Extra actions after a message is blocked ---------------------------
  # Empty by default: block the matching message, alert staff, log a case,
  # but do not mute the player or clear chat for everyone. Opt into extra
  # actions with /nmod action add ...; order matters.
  #   type: CLEAR_CHAT | MUTE | KICK | BAN
  #   MUTE also takes durationSeconds and an optional reason.
  actions: []

  # ---- Local anti-spam (no API key needed, runs before everything) --------
  # Set any limit to 0 to disable that single check.
  spam:
    enabled: true
    # Max chat messages per player per 10 seconds.
    messagesPer10s: 5
    # Same/similar message this many times in a row gets flagged.
    duplicateLimit: 3
    similarityThreshold: 0.9
    # Flag messages over this % uppercase (only when at least capsMinLength
    # letters). Player names don't count.
    capsPercent: 70
    capsMinLength: 8
    # Flag runs of the same character longer than this (aaaaaaaaa...).
    maxCharRun: 8
    # Max scanned commands per player per 10 seconds (see surfaces.command).
    commandsPer10s: 8

  # ---- Progressive enforcement (strikes) -----------------------------------
  # Off on a new install. Turn on only after reviewing the word list and
  # testing your policy: every enforced detection adds a strike, and a rung
  # below can run a separate action even when actions above is empty.
  strikes:
    enabled: false
    decayMinutes: 30
    escalation:
      - atStrikes: 4
        type: KICK
        reason: "Repeated inappropriate chat"

  # ---- Extra surfaces (local rules only; the cloud is never blocking here) --
  # Each can be: off | monitor | censor | block (or change in-game with /nmod surface)
  surfaces:
    sign: "off"
    book: "off"
    anvil: "off"
    command: "off"
    # Which commands' arguments get scanned when command != off.
    scannedCommands: [ "msg", "tell", "w", "whisper", "me", "r", "reply" ]

  # ---- Local case history ---------------------------------------------------
  # SQLite log of detections at plugins/NeoModeration/cases.db.
  # View in-game with /nmod cases [player] and /nmod case <id>.
  cases:
    enabled: true
    # Store a short preview of the offending content. Off by default so the
    # log stays privacy-clean (metadata only).
    storeContent: false

  # ---- Staff alerts --------------------------------------------------------
  # Players with the neomoderation.notify permission (ops by default) get an
  # in-game alert whenever content is flagged, in both monitor and enforce mode.
  alerts:
    enabled: true
    # Include a short preview of the offending message in the alert. Set to
    # false to redact content from staff chat.
    includeMessage: true
    # Optional Discord webhook URL for staff alerts when moderators are offline in-game.
    discordWebhookUrl: ""

  chat:
    # Hook Paper's async chat event for lower-latency scanning.
    scanAsyncChat: true
    # If the cloud is unreachable, let the message through (true) instead of
    # blocking it (false).
    failOpen: true
    # Replace locally-matched words/links with **** instead of blocking the
    # whole message. Censored messages still count strikes and alert staff,
    # but skip the punishment actions. Cloud detections always block.
    censorLocalDetections: false
