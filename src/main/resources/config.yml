# ===========================================================================
#  NeoModeration
#  Chat and map-art moderation for Minecraft.
#
#  Most settings can also be changed in-game with /nmod (no restart needed).
#  Run "/nmod status" any time to see what is currently active.
# ===========================================================================

# Language of the console and of players whose game language has no messages:
# en_US, es_ES, fr_FR, de_DE, pt_BR, tr_TR, or your own file in /locale.
locale: "en_US"

# Players read NeoModeration's messages in their own Minecraft language when
# it is English, Spanish, French, German, Portuguese or Turkish. Set to false
# to use "locale" for everyone.
perPlayerLanguage: true

# Check GitHub once at startup for a newer NeoModeration, log one line if there
# is one, and tell each admin once when they join. The request names only the
# plugin version and server software, and nothing is ever downloaded.
updateCheck: true

moderation:
  # Master switch. When false, NeoModeration does nothing.
  enabled: true

  # Tell a player why their message, sign, book, item name or command was
  # stopped ("It has a word this server blocks."). The text is in the locale
  # files under "notice" and "why".
  tellPlayers: true

  # How detections are handled:
  #   monitor = detect, alert staff and count what would happen, but never
  #             block a message or punish a player.
  #   enforce = block flagged content and run the actions configured below.
  #
  # This is the mode for LOCAL rules: the word and URL lists below, and
  # anti-spam. The bundled starter list blocks matching messages straight
  # away, but it does not punish players or clear everyone else's chat. Review
  # the list for your server's standards. Switch back any time with
  # /nmod mode monitor.
  mode: "enforce"

  # The same setting for CLOUD decisions, which a model makes. A new install
  # only ALERTS on these until you have watched it decide for a while, then
  # run:  /nmod cloudmode enforce
  # Remove this key entirely to make cloud decisions follow "mode" above.
  cloudMode: "monitor"

  # ---- Local rules (no API key required, evaluate instantly) --------------
  offline:
    enabled: true
    # Block every link, including ones missing from bannedUrls.
    blockAnyUrl: false
    # Block messages that advertise another Minecraft server: a public IP
    # address, any address with a port, play./mc./smp. style addresses,
    # free-host addresses (aternos.me, minehut.gg ...) and "join myserver.net".
    # Ordinary links such as YouTube or a wiki page are not affected. Add your
    # own server's address to allowedUrls so players can share it.
    blockServerAds: true
    # Treat "b4dw0rd" style spellings as their plain-text equivalent.
    normalizeLeetspeak: true
    # A starter English list so a new install blocks real abuse immediately.
    # Review it for your server and change it in-game with /nmod word and
    # /nmod allow. A word only matches from the start of a word to the end of
    # one, so "assignment" and "Scunthorpe" stay clean. A word split into
    # pieces is still caught ("f uck", "f'uck", "k y s"), but everyday words of
    # English or the server's language stay clean when together they spell a
    # listed word ("put a torch here"), and for the language packs' words so do
    # the player's own language's. A word written with a space, such as
    # "ass hole", is caught however it is spaced.
    # Inflections are listed explicitly. "badword" is kept so the documented
    # check /nmod test badword works.
    bannedWords:
      - "badword"
      - "fuck"
      - "fucks"
      - "fucked"
      - "fucking"
      - "fuckin"
      - "fuk"
      - "fucker"
      - "fuckers"
      - "fck"
      - "fcking"
      - "fvck"
      - "fvcking"
      - "phuck"
      - "phucking"
      - "motherfucker"
      - "motherfuckers"
      - "shit"
      - "shits"
      - "shitty"
      - "bullshit"
      - "bitch"
      - "bitches"
      - "biatch"
      - "cunt"
      - "cunts"
      - "asshole"
      - "assholes"
      - "bastard"
      - "bastards"
      - "dickhead"
      - "whore"
      - "whores"
      - "slut"
      - "sluts"
      - "nigger"
      - "niggers"
      - "nigga"
      - "niggas"
      - "niqqer"
      - "niqqa"
      - "faggot"
      - "faggots"
      - "fag"
      - "fags"
      - "tranny"
      - "trannies"
      - "dyke"
      - "dykes"
      - "kike"
      - "kikes"
      - "paki"
      - "pakis"
      - "gook"
      - "gooks"
      - "wet back"
      - "wet backs"
      - "beaner"
      - "beaners"
      - "retard"
      - "retarded"
      - "wanker"
      - "twat"
      - "kys"
    # Starter lists in other languages, added to the list above:
    #   auto           the language of "locale" (English has no extra pack)
    #   es, fr, de, pt, tr   name the packs you want, for example [auto, es]
    #   all            every pack, for a server with players from many countries
    # Use [] for none. Ordinary words that look like a swear word in another
    # language ("pic", "cono", "Amina") are left out of every pack. The pt
    # pack follows Brazilian Portuguese. A few words are everyday words in one
    # language and banned in another: French "retard", Spanish "Kike", Swedish
    # "slut" and "fick", "puto" and "bicha" in Portugal. They pass for everyone
    # when "locale" is that language, and for a player whose game language it
    # is when the message is written in that language.
    languagePacks: [auto]
    bannedUrls:
      - "grabify.link"
      - "iplogger.org"
      - "2no.co"
      - "yip.su"
      - "blasze.com"
      - "curiouscat.club"
      - "ps3cfw.com"
      - "discord.gg/free"
      - "discord-nitro"
      - "discordnitro"
      - "discord.gift"
      - "free-nitro"
      - "hypixel-giveaway"
      - "minecon-cape"
      - "minecon-capes"
      - "optifine-cape"
      - "steamcommunity.link"
    # Exceptions that always win over the rules above (manage with /nmod allow).
    # allowedWords are whole phrases: a banned word inside an allowed phrase is
    # ignored. allowedUrls are substring matches, exactly like bannedUrls, and
    # also exempt matching links from blockAnyUrl.
    allowedWords: []
    allowedUrls: []

  # ---- Cloud moderation (requires a Neomechanical API key) -----------------
  # Run "/nmod trial" in-game or from the console for a free 14-day cloud
  # trial; it needs no account. Or sign up at
  # https://neomechanical.com/signup?src=neomoderation, create a key with
  # events:write and usage:read, then run:  /nmod setup <apiKey>
  # Check the key and credits with /nmod doctor. If credits run out, add more
  # at https://neomechanical.com/billing?src=neomoderation_credits.
  api:
    endpoint: "https://api.neomechanical.com/v1/events"
    apiKey: ""
    # Chat never waits more than ~2.5s total for the cloud, regardless of these
    # values; raise them only if your network genuinely needs it.
    connectTimeoutMs: 2000
    readTimeoutMs: 2000

  # Which content categories the cloud should flag. Ignored when no API key
  # is set. Each category accepts:
  #   true  = on at the default sensitivity (0.7)
  #   false = off
  #   0.05 - 0.99 = custom score threshold (lower = stricter)
  # Or apply a bundle with /nmod preset <family|community|minimal>.
  categories:
    sexual: true
    hate: true
    harassment: true
    violence: true
    scam: true
    spam: true
    illicit: true
    selfHarm: true

  # ---- Map art (filled maps) ----------------------------------------------
  # The cloud checks map pictures against the categories above. Requires an
  # API key. Each picture is checked once; drawing on a map makes it a new
  # picture, which is checked again.
  mapArt:
    enabled: true
    # Check a filled map when a player holds it.
    scanOnHold: true
    # Check a map a player puts in an item frame, or right-clicks in one.
    scanOnFrameInteract: true
    # Take a flagged map away from the player holding it (in enforce cloudMode).
    # A flagged map already hanging in a frame is taken down, and the player who
    # clicked it is not blamed. When false, staff are alerted and the map stays.
    confiscate: true
    # How many map results to remember (safe + flagged) before old ones drop.
    cacheSize: 1000
    # Most new pictures one player can have checked in an hour, so nobody can
    # use up the server's cloud credits by drawing maps. 0 means no limit.
    checksPerPlayerPerHour: 30

  # ---- Extra actions after a message is blocked ---------------------------
  # Empty by default: block the matching message, alert staff, log a case,
  # but do not mute the player or clear chat for everyone. Add actions with
  # /nmod action add <clear|mute|kick|ban>; they run in order. They follow a
  # banned word, link or server ad; spam is only blocked.
  #   type: CLEAR_CHAT | MUTE | KICK | BAN | COMMAND
  #   MUTE takes durationSeconds; KICK and BAN take an optional reason, which
  #   players otherwise read in their own language.
  #   COMMAND runs "command" from the console, with %PLAYER%, %UUID%,
  #   %DURATION% and %REASON% filled in. TIMEOUT runs "tempmute", and
  #   GIVE_ROLE, TAKE_ROLE and TEMP_ROLE run LuckPerms with "role", unless
  #   "command" says otherwise.
  actions: []

  # ---- Local anti-spam (no API key needed, runs before everything) --------
  # Set any limit to 0 to disable that single check.
  spam:
    enabled: true
    # Max chat messages per player per 10 seconds.
    messagesPer10s: 5
    # Same/similar message this many times in a row gets flagged.
    duplicateLimit: 3
    similarityThreshold: 0.9
    # A message over this % uppercase (with at least capsMinLength letters) is
    # sent in lower case instead of being blocked. The sender's own name does
    # not count.
    capsPercent: 70
    capsMinLength: 8
    # Flag runs of the same character longer than this (aaaaaaaaa...).
    maxCharRun: 8
    # Max scanned commands per player per 10 seconds (see surfaces.command).
    commandsPer10s: 8

  # ---- Progressive enforcement (strikes) -----------------------------------
  # Off on a new install. Turn on only after reviewing the word list and
  # testing your policy: every enforced detection adds a strike, and a rung
  # below can run a separate action even when actions above is empty.
  strikes:
    enabled: false
    decayMinutes: 30
    escalation:
      - atStrikes: 4
        type: KICK
        reason: "Repeated inappropriate chat"

  # ---- Signs, books, item names and commands (local rules only) -----------
  # Each can be: off | monitor | censor | block. Change them in-game with
  # /nmod surface.
  surfaces:
    sign: "off"
    book: "off"
    anvil: "off"
    command: "off"
    # Which commands' arguments get scanned when command != off. A muted player
    # cannot use them either, whatever command is set to.
    scannedCommands: [ "msg", "tell", "w", "whisper", "me", "r", "reply" ]

  # ---- Local case history ---------------------------------------------------
  # Every detection is saved in plugins/NeoModeration/cases.db. Browse it
  # in-game with /nmod cases [player] or /nmod cases <id>, and resolve,
  # dismiss or allow a word from there.
  cases:
    enabled: true
    # Keep a short preview of what the player wrote. Off by default, so the
    # history holds who, where and why, never the message.
    storeContent: false

  # ---- Staff alerts --------------------------------------------------------
  # Players with the neomoderation.notify permission (ops by default) get an
  # in-game alert whenever content is flagged, in both monitor and enforce mode.
  alerts:
    enabled: true
    # Show a short preview of the message in the alert. Set to false to keep
    # message text out of staff chat and Discord.
    includeMessage: true
    # A Discord webhook that receives the same alerts, for when no moderator is
    # online. Set it with /nmod discord <webhook URL>; /nmod discord test sends
    # one to check it.
    discordWebhookUrl: ""

  chat:
    # Check chat messages. When false, chat is not checked at all; signs,
    # books and commands follow their own settings above.
    scanAsyncChat: true
    # If the cloud is unreachable, let the message through (true) instead of
    # holding it back (false).
    failOpen: true
    # Replace locally matched words and links with **** instead of blocking the
    # whole message. Censored messages still count strikes and alert staff,
    # but skip the actions above. Cloud decisions are never censored: they
    # block or alert, as cloudMode says.
    censorLocalDetections: false
