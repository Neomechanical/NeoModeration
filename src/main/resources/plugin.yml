name: NeoModeration
version: '${project.version}'
description: Chat, anti-spam and map-art moderation for Minecraft.
main: com.neomechanical.neomoderation.NeoModerationPlugin
load: POSTWORLD
authors:
  - Neomechanical
website: https://neomechanical.com/docs/use-cases/minecraft
prefix: NeoModeration
api-version: 1.18
folia-supported: true
softdepend: [ LuckPerms ]
commands:
  neomod:
    description: Manage NeoModeration.
    usage: /nmod help
    aliases: [ neomoderation, nmod ]
permissions:
  neomoderation.admin:
    description: Every /nmod command, settings and the cloud key included.
    default: op
    children:
      neomoderation.moderate: true
  neomoderation.moderate:
    description: Day-to-day moderation with /nmod help, status, test, privacy, cases, mute and unmute.
    default: op
  neomoderation.bypass:
    description: Skips moderation checks.
    default: false
  neomoderation.notify:
    description: Receives in-game alerts when content is flagged.
    default: op
