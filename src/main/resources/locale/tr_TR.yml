# NeoModeration metinleri: Türkçe.
#
# İstediğiniz metni değiştirip /nmod reload çalıştırın. Değiştirdiğiniz metin
# sizin kalır: güncellemeler yalnızca hiç düzenlemediğiniz metinleri değiştirir.
# {Süslü parantez} içindeki kelimeleri eklenti doldurur. Renkler bir kez "colors"
# altında tanımlanır ve {#ad} olarak kullanılır.

colors:
  brand: "&x&9&c&a&8&f&f"
  safe: "&x&3&e&c&f&9&a"
  review: "&x&f&5&b&5&4&a"
  risk: "&x&f&f&7&a&7&0"
  text: "&f"
  muted: "&7"
  faint: "&8"

prefix: "{#faint}[{#brand}NeoMod{#faint}]"

format:
  date: "d MMMM yyyy"

label:
  "on": "açık"
  "off": "kapalı"
  none: "yok"
  blocking: "engelleme"
  alert-only: "yalnızca bildirim"
  not-armed: "denetlenecek bir şey yok"

error:
  no-permission: "{prefix} {#muted}NeoModeration'ı kullanma izniniz yok."
  no-api-key: "{prefix} {#muted}Bunun için bir bulut anahtarı gerekir. Ücretsiz 14 günlük deneme için {#brand}/nmod trial{#muted} çalıştırın ya da {#brand}{url}{#muted} adresinde bir anahtar oluşturup {#brand}/nmod setup <anahtar>{#muted} çalıştırın."
  api-key-too-long: "{prefix} {#risk}Bu anahtar {max} karakterden uzun."
  rule-too-long: "{prefix} {#risk}Bu, {max} karakterden uzun."
  player-unknown: "{prefix} {#risk}{#text}{player}{#risk} adlı bir oyuncu burada hiç oynamadı."
  unknown-command: "{prefix} {#risk}/{label} {command} diye bir komut yok. {#muted}Olanlar şunlar:"
  admin-only: "{prefix} {#muted}/{label} {command} komutunu yalnızca yöneticiler kullanabilir."

help:
  section:
    start: "{#text}&lBaşlarken"
    rules: "{#text}&lKurallar ve eylemler"
    tools: "{#text}&lAraçlar"
    admin: "{#text}&lYönetim"
  footer: "{#faint}&m                                        "
  dashboard: "{#brand}&lNeoModeration{#faint} {version}{#muted}. Yerel kurallar: {#text}{mode}{#muted}, bulut: {#text}{cloud}{#muted}, başlangıçtan beri {#text}{total}{#muted} yakalama"
  page: "{#faint}Sayfa {page}/2. {#muted}Devamı: {#brand}/nmod help {next}"
  hint: "{#faint}Çalıştırmak ya da sohbet kutunuza koymak için bir komuta tıklayın. Ne yaptığını görmek için üzerine gelin."
  hint-console: "{#faint}Çalıştırmak için bu komutlardan birini yazın."
  entry-usage: "  {#brand}{usage}"
  entry-desc: "  {#muted}{desc}"
  entry-hover: "{#brand}{usage}\n{#muted}{desc}"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <anahtar>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    discord: "/nmod discord"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    mute: "/nmod mute <oyuncu>"
    unmute: "/nmod unmute <oyuncu>"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    cloudmode: "/nmod cloudmode"
    reload: "/nmod reload"
    "on": "/nmod on"
    "off": "/nmod off"
  desc:
    trial: "ücretsiz 14 günlük bulut denemesi ne yapar"
    setup: "bir bulut anahtarı bağla"
    status: "şu anda neler korunuyor"
    mode: "engelle ya da yalnızca yetkililere bildir"
    preset: "bulutun ne kadar katı olduğu"
    word: "yasaklı kelimeler"
    url: "engellenen bağlantılar"
    allow: "her zaman geçerli istisnalar"
    action: "bir engellemeden sonra ne olur"
    surface: "tabelalar, kitaplar, eşya adları ve komutlar"
    discord: "uyarıları bir Discord kanalına gönder"
    test: "bir mesajı güvenle dene"
    doctor: "kurulum sorunlarını bul"
    cases: "neyin, kimde yakalandığı"
    mute: "bir oyuncuyu bir süre sustur"
    unmute: "susturulan bir oyuncunun yeniden yazmasına izin ver"
    usage: "bulut kredileri ve sınırları"
    privacy: "hangi veri nereye gidiyor"
    key: "bulut anahtarını değiştir ya da kaldır"
    cloudmode: "bulut kararlarında engelle ya da yalnızca bildir"
    reload: "yapılandırmayı ve metinleri yeniden yükle"
    "on": "moderasyonu aç"
    "off": "moderasyonu kapat"

setup:
