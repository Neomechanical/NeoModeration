  explain-monitor: "  {#muted}Bulut kararları, siz {#brand}/nmod cloudmode enforce{#muted} çalıştırana kadar yalnızca yetkililere bildirilir. Kelime listeleriniz şimdiki gibi çalışmaya devam eder."
