  server-ads: "Bu güncellenmiş sunucuda başka sunucu reklamlarına izin verilmeye devam ediyor (moderation.offline.blockServerAds: false). Engellemek için önce kendi adresinizi allowedUrls'e ekleyin, sonra true yapın."
  language-packs: "Dilinizin başlangıç listesi bu güncellenmiş sunucuda kapalı kalıyor (moderation.offline.languagePacks: []). Açmak için [auto] yapın."
  tell-players: "Oyunculara artık bir mesajın neden durdurulduğu söyleniyor (moderation.tellPlayers: true). Sessizce engellemek için false yapın."
  per-player-on: "Her oyuncu artık NeoModeration metinlerini kendi oyun dilinde okuyor (perPlayerLanguage: true)."
  per-player-off: "Bütün oyuncular düzenlediğiniz {locale} metinlerini okumaya devam ediyor (perPlayerLanguage: false). Herkesin kendi oyun dilini görmesi için true yapın."
  map-art-cap: "Bulut artık oyuncu başına saatte en fazla {count} yeni harita resmini denetliyor (moderation.mapArt.checksPerPlayerPerHour: {count}); böylece kimse harita çizerek kredilerinizi tüketemez. Sınır olmaması için 0 yapın."
  trust-language: "Kelime listenizde başka dillerde gündelik olan kelimeler var ({words}). Oyuncuların kendi dillerinde yazarken bunları kullanabilmesi için moderation.offline.trustPlayerLanguage değerini true yapın."
