  server-ads: "{#muted}Werbung für andere Server: {#text}{value}"
  checks: "{#muted}Anti-Spam {#text}{spam}{#muted}, Verwarnungen {#text}{strikes}{#muted}, Fallverlauf {#text}{cases}"
