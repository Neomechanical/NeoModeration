# NeoModeration-Texte: Deutsch.
#
# Ändere einen Text und führe danach /nmod reload aus. Ein Text, den du änderst,
# bleibt deiner: Updates ersetzen nur Texte, die du nie bearbeitet hast. Wörter
# in {Klammern} füllt das Plugin aus. Farben stehen einmal unter "colors" und
# werden als {#name} verwendet.

colors:
  brand: "&x&9&c&a&8&f&f"
  safe: "&x&3&e&c&f&9&a"
  review: "&x&f&5&b&5&4&a"
  risk: "&x&f&f&7&a&7&0"
  text: "&f"
  muted: "&7"
  faint: "&8"

prefix: "{#faint}[{#brand}NeoMod{#faint}]"

format:
  date: "d. MMMM yyyy"

label:
  "on": "an"
  "off": "aus"
  none: "keine"
  blocking: "blockieren"
  alert-only: "nur melden"
  not-armed: "nichts zu prüfen"

error:
  no-permission: "{prefix} {#muted}Du darfst NeoModeration nicht verwenden."
  no-api-key: "{prefix} {#muted}Dafür brauchst du einen Cloud-Schlüssel. Führe {#brand}/nmod trial{#muted} für einen kostenlosen 14-Tage-Test aus oder erstelle einen Schlüssel unter {#brand}{url}{#muted} und führe {#brand}/nmod setup <Schlüssel>{#muted} aus."
  api-key-too-long: "{prefix} {#risk}Dieser Schlüssel ist länger als {max} Zeichen."
  rule-too-long: "{prefix} {#risk}Das ist länger als {max} Zeichen."
  player-unknown: "{prefix} {#risk}Ein Spieler namens {#text}{player}{#risk} war noch nie hier."
  unknown-command: "{prefix} {#risk}/{label} {command} gibt es nicht. {#muted}Das gibt es:"
  admin-only: "{prefix} {#muted}Nur Admins dürfen /{label} {command} verwenden."

help:
  section:
    start: "{#text}&lErste Schritte"
    rules: "{#text}&lRegeln und Aktionen"
    tools: "{#text}&lWerkzeuge"
    admin: "{#text}&lVerwaltung"
  footer: "{#faint}&m                                        "
  dashboard: "{#brand}&lNeoModeration{#faint} {version}{#muted}: lokale Regeln {#text}{mode}{#muted}, Cloud {#text}{cloud}{#muted}, {#text}{total}{#muted} Treffer seit dem Start"
  page: "{#faint}Seite {page} von 2. {#muted}Weiter: {#brand}/nmod help {next}"
  hint: "{#faint}Klicke auf einen Befehl, um ihn auszuführen oder in dein Chatfeld zu setzen. Fahre darüber, um zu sehen, was er tut."
  hint-console: "{#faint}Tippe einen dieser Befehle ein, um ihn auszuführen."
  entry-usage: "  {#brand}{usage}"
  entry-desc: "  {#muted}{desc}"
  entry-hover: "{#brand}{usage}\n{#muted}{desc}"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <Schlüssel>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    discord: "/nmod discord"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    mute: "/nmod mute <Spieler>"
    unmute: "/nmod unmute <Spieler>"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    cloudmode: "/nmod cloudmode"
    reload: "/nmod reload"
    "on": "/nmod on"
    "off": "/nmod off"
  desc:
    trial: "was ein kostenloser 14-Tage-Cloud-Test macht"
    setup: "einen Cloud-Schlüssel verbinden"
    status: "was gerade geschützt ist"
    mode: "blockieren oder nur ans Team melden"
    preset: "wie streng die Cloud ist"
    word: "verbotene Wörter"
    url: "gesperrte Links"
    allow: "Ausnahmen, die immer gelten"
    action: "was nach einer Blockierung passiert"
    surface: "Schilder, Bücher, Item-Namen und Befehle"
    discord: "Hinweise in einen Discord-Kanal senden"
    test: "eine Nachricht gefahrlos ausprobieren"
    doctor: "Einrichtungsprobleme finden"
    cases: "was erkannt wurde und bei wem"
    mute: "einen Spieler eine Weile stummschalten"
    unmute: "einen Spieler wieder schreiben lassen"
    usage: "Cloud-Guthaben und Limits"
    privacy: "welche Daten wohin gehen"
    key: "den Cloud-Schlüssel ersetzen oder entfernen"
    cloudmode: "bei Cloud-Entscheidungen blockieren oder nur melden"
    reload: "Konfiguration und Texte neu laden"
    "on": "die Moderation einschalten"
    "off": "die Moderation ausschalten"

setup:
  usage: "{prefix} {#muted}Führe {#brand}/{label} setup <Schlüssel>{#muted} mit einem Schlüssel von {#brand}{url}{#muted} aus, oder {#brand}/{label} trial{#muted} für einen kostenlosen 14-Tage-Test."
  done: "{prefix} {#safe}Schlüssel gespeichert. {#muted}Prüfe ihn mit {#brand}/nmod doctor{#muted}, dann mit {#brand}/nmod test hello{#muted}."

key:
  usage: "{prefix} {#muted}Nutze {#brand}/{label} key set <Schlüssel>{#muted} oder {#brand}/{label} key clear{#muted}."
  saved: "{prefix} {#safe}Schlüssel gespeichert. {#muted}Prüfe ihn mit {#brand}/nmod doctor{#muted}."
  cleared: "{prefix} {#muted}Schlüssel entfernt. Jetzt laufen nur noch die lokalen Regeln."

trial:
  pending: "{prefix} {#muted}Ein Test startet bereits. Warte, bis er fertig ist."
  explain-title: "{prefix} {#brand}Ein kostenloser 14-Tage-Cloud-Test{#muted}, ohne Konto."
  explain-sends: "  {#muted}Solange er läuft, geht jede Chatnachricht und jedes Kartenbild mit Name und UUID des Spielers zur Prüfung an Neomechanical. Nachrichten und Bilder werden weder gespeichert noch zum Training verwendet."
  explain-monitor: "  {#muted}Cloud-Entscheidungen melden sich nur beim Team, bis du {#brand}/nmod cloudmode enforce{#muted} ausführst. Deine Wortlisten arbeiten weiter wie bisher."
  start-button: "  {#brand}[Kostenlosen Test starten]"
  start-hover: "{#muted}Führt {command} aus"
  start-console: "  {#muted}Führe {#brand}{command}{#muted} aus, um ihn zu starten."
  configuration-changed: "{prefix} {#review}Die Cloud-Einstellungen haben sich geändert, während der Test startete, deshalb bleiben deine. {#muted}Mit {#brand}/nmod trial{#muted} siehst du sie."
  requesting: "{prefix} {#muted}Dein kostenloser 14-Tage-Cloud-Test startet..."
  activated: "{prefix} {#safe}Dein 14-Tage-Cloud-Test läuft bis zum {#text}{expires}{#safe}."
  activated-monitor: "{prefix} {#muted}Cloud-Entscheidungen melden sich zuerst nur beim Team. Führe {#brand}/nmod cloudmode enforce{#muted} aus, wenn du ihnen vertraust."
  moderation-off: "{prefix} {#review}Die Moderation ist aus, also wird noch nichts geprüft. {#muted}Führe {#brand}/nmod on{#muted} aus, wenn du so weit bist."
  already-claimed: "{prefix} {#risk}Dieser Server hat seinen kostenlosen Test schon genutzt. {#muted}Hol dir einen Schlüssel unter {#brand}{url}{#muted}."
  rate-limited: "{prefix} {#risk}Aus diesem Netzwerk wurden heute zu viele Tests gestartet. {#muted}Versuch es morgen wieder oder registriere dich unter {#brand}{url}{#muted}."
  failed: "{prefix} {#risk}Der Test ist nicht gestartet: {error}."
  error:
    transport: "Neomechanical war nicht erreichbar"
    server: "der Testdienst hatte einen Fehler"
    invalid-response: "der Testdienst schickte eine Antwort, die diese Version nicht lesen kann"
    forbidden: "der Testdienst hat diese Installation nicht angenommen"
    invalid-endpoint: "moderation.api.endpoint ist keine gültige Adresse"
  status-no-key: "{prefix} {#muted}Noch kein Cloud-Schlüssel. Führe {#brand}/nmod trial{#muted} für einen kostenlosen 14-Tage-Test aus."
  status-checking: "{prefix} {#muted}Der Cloud-Test wird geprüft..."
  status-active: "{prefix} {#safe}Cloud-Test bis zum {#text}{expires}{#safe}. {#muted}Tage übrig: {#text}{days}"
  status-caught: "{prefix} {#muted}Von der Cloud erkannt während des Tests: {#text}{count}"
  status-caught-startup: "{prefix} {#muted}Von der Cloud erkannt seit dem Start: {#text}{count}"
  status-expired: "{prefix} {#risk}Der Cloud-Test endete am {#text}{expires}{#risk}. {#muted}Die lokalen Regeln laufen weiter."
  status-standard: "{prefix} {#safe}Dieser Server nutzt einen vollen Neomechanical-Schlüssel. {#muted}Dein Guthaben zeigt {#brand}/nmod usage{#muted}."
  keep-button: "  {#brand}[Cloud-Moderation behalten]"
  keep-hover: "{#muted}Öffnet {url}"
  cta-button: "  {#brand}[Kostenloser 14-Tage-Cloud-Test]"
  cta-hover: "{#muted}Führt /nmod trial aus. Kein Konto nötig."

toggle:
  "on": "{prefix} {#safe}Die Moderation ist an."
  "off": "{prefix} {#risk}Die Moderation ist aus. {#muted}Nichts wird geprüft, bis du {#brand}/nmod on{#muted} ausführst."

