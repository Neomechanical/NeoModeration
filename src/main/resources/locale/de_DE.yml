  status-no-key: "{prefix} &eKein API-Schlüssel konfiguriert. &7Führe &e/nmod trial &7für einen 14-Tage-Test aus oder registriere dich unter &f{url}"
  status-checking: "{prefix} &7Prüfe Cloud-Teststatus..."
  status-active: "{prefix} &aCloud-Test aktiv &8(&f{days} &7Tag(e) übrig, läuft ab am &f{expires}&8)&7. Upgrade unter &f{url}"
  status-expired: "{prefix} &cDein 14-Tage-Cloud-Test ist am &f{expires} &cabgelaufen. &7Upgrade unter &f{url} &7und führe &e/nmod setup <key> &7aus."
