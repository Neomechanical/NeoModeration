  actions: "{#muted}Nach einer Blockierung: {#text}{value}"
  alerts: "{#muted}Hinweise ans Team: {#text}{value}"
  discord: "{#muted}Discord-Hinweise: {#text}{value}"
  cloud: "{#muted}Cloud: {#text}{value}"
  cloud-no-key: "{#muted}Cloud: {#text}kein Schlüssel{#muted}. Führe {#brand}/nmod trial{#muted} für einen kostenlosen 14-Tage-Test aus."
  cloud-no-key-staff: "{#muted}Cloud: {#text}kein Schlüssel{#muted}."
