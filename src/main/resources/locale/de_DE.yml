  activated: "{prefix} &a14-Tage-Cloud-Test aktiviert (läuft ab am &f{expires}&a). Cloud-Prüfungen für Chat und Karten starten im Monitor-Modus. Übernimm diesen Workspace unter &f{url}&a oder führe &e/nmod doctor &azur Prüfung aus."
