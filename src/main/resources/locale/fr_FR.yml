  cloud-transient: "{#muted}Dernière vérification cloud : {#review}pas de réponse{#muted}. Les règles locales fonctionnent toujours ; {#brand}/nmod reload{#muted} réessaie tout de suite."
  cloud-busy: "{#muted}Messages que le cloud n'a pas eu le temps de vérifier depuis le démarrage (le chat allait trop vite) : {#text}{count}"
  value:
    alerts-preview: "activées, avec le message"
    alerts-hidden: "activées, message masqué"
    server-ads-on: "bloquées"
    server-ads-off: "autorisées"
    player-language-on: "prises en compte (moderation.offline.trustPlayerLanguage)"
