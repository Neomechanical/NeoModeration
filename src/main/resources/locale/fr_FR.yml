  cloud-skipped-categories: "{prefix} &7Texte cloud : &8ignoré (toutes les catégories sont désactivées). L'analyse des cartes peut rester active."
  cloud-skipped-circuit: "{prefix} &7Cloud : &8ignoré (mis en pause après des erreurs; /nmod reload pour réessayer)"
  would-allowed: "{prefix} &7Résultat : &aautorisé"
  would-monitor: "{prefix} &7Résultat : &ealerte monitor uniquement &7(sans blocage ni sanction)"
  would-censor: "{prefix} &7Résultat : &econtenu censuré"
