  list-item: "&7{index}. &c{value}"
  empty: "{prefix} &eAucune action configurée. Les messages sont bloqués sans sanction."
  added: "{prefix} &aAction ajoutée : &f{value}"
  removed: "{prefix} &eAction retirée : &f{value}"
  missing: "{prefix} &cCette action n'est pas configurée : &f{value}"
  unknown: "{prefix} &cAction inconnue. &7Utilisez clear, mute, kick ou ban."
  bad-duration: "{prefix} &cDurée invalide : &f{value}&c. &7Essayez 30s, 5m ou 1h (max 30d)."
  reset: "{prefix} &aActions supplémentaires effacées : les messages sont bloqués sans sanction automatique. &7L'escalade d'avertissements se configure séparément."
usage:
  fetching: "{prefix} &7Récupération de l'utilisation sur Neomechanical..."
  title: "&8&m----------&r &x&9&c&a&8&f&f&lUtilisation Neomechanical &8&m----------"
  workspace: "&7Espace : &f{value}"
  plan: "&7Forfait : &f{value} &8(limite &f{rpm}&7/min&8)"
  credits: "&7Crédits restants : &a{value}"
