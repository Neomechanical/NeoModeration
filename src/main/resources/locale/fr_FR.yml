  cloud-plan-trial-revoked: "{#muted}Offre cloud : {#risk}l'essai cloud a été arrêté{#muted}. Créez un compte gratuit sur {#brand}{url}{#muted}, puis une clé, et lancez {#brand}/nmod setup <clé>{#muted}."
