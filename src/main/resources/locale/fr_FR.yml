  error-credits: "{prefix} &cCrédits insuffisants. &7Ajoutez des crédits sur &f{billingUrl}&7, puis exécutez &e/nmod test hello&7."
  error-request: "{prefix} &cLa requête d'utilisation a été refusée, sans que la clé soit classée invalide. &7Exécutez &e/nmod doctor&7."
mapart:
  confiscated: "{prefix} &cCette carte contient du contenu inapproprié et a été retirée."
  blocked: "{prefix} &cCette carte est signalée comme inappropriée et ne peut pas être utilisée."
mute:
  blocked: "&cVous êtes réduit au silence pendant &f{duration}&c."
