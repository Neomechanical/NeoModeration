  cloud-unverified: "&7État des événements : &enon vérifié depuis le démarrage/rechargement&7. Exécutez &e/nmod test hello&7."
  cloud-ready: "&7État des événements : &ala dernière requête a réussi&7. Exécutez &e/nmod usage &7pour voir les crédits du compte."
  cloud-auth: "&7État des événements : &cclé API refusée&7. Remplacez-la sur &f{keysUrl}&7, puis exécutez &e/nmod setup <key>&7."
  cloud-credits: "&7État des événements : &ccrédits insuffisants&7. Ajoutez des crédits sur &f{billingUrl}&7, puis exécutez &e/nmod test hello&7."
  cloud-request-error: "&7État des événements : &crequête refusée&7, sans que la clé soit classée invalide. Vérifiez l'endpoint avec &e/nmod doctor&7, puis exécutez &e/nmod test hello&7."
  cloud-transient: "&7État des événements : &eerreur temporaire réseau/serveur&7. Les règles locales restent actives; utilisez &e/nmod reload &7pour réessayer."
  rules: "&7Règles locales configurées : &b{words} &7mots, &b{urls} &7liens"
  allow: "&7Exceptions : &b{words} &7expressions autorisées, &b{urls} &7liens autorisés"
  actions: "&7À la détection : &c{value}"
  alerts: "&7Alertes staff : &f{value}"
  coverage: "&7Anti-spam : &f{spam} &8| &7Avertissements : &f{strikes} &8| &7Surfaces : &f{surfaces}/4 &8| &7Cas : &f{cases}"
  detections: "&7Détections depuis le démarrage : &b{value}"
reload:
  done: "{prefix} &aConfiguration rechargée avec succès."
rules:
  usage: "{prefix} &cUtilisation : &e/{label} {kind} <add|remove|list> [valeur]"
  list: "{prefix} &7{kind}s bloqués : &b{values}"
  value-required: "{prefix} &cVeuillez indiquer une valeur à ajouter ou retirer."
  updated: "{prefix} &a{action} {kind} : &f{value}"
  unchanged: "{prefix} &eAucun changement pour {kind} : &f{value}"
action:
  usage: "{prefix} &cUtilisation : &e/{label} action <list|add|remove|reset>"
  add-usage: "{prefix} &cUtilisation : &e/{label} action add <clear|mute|kick|ban> [durée]"
  remove-usage: "{prefix} &cUtilisation : &e/{label} action remove <clear|mute|kick|ban>"
