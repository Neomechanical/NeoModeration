# Préfixe partagé du chat. Chaque message l'utilise via {prefix}.
prefix: "&8[&x&9&c&a&8&f&fNeoMod&8]"
error:
  no-permission: "{prefix} &cVous n'avez pas la permission d'utiliser NeoModeration."
  no-api-key: "{prefix} &cAucune clé API configurée. &7Exécutez &e/nmod trial &7pour un essai gratuit de 14 jours, ou inscrivez-vous sur &f{url} &7et exécutez &e/nmod setup <apiKey>"
  api-key-too-long: "{prefix} &cLa clé API est trop longue (max {max} caractères)."
  rule-too-long: "{prefix} &cLa valeur est trop longue (max {max} caractères)."
help:
  title: "&8&m----------&r &x&9&c&a&8&f&f&lNeoModeration &8&m----------"
  section:
    start: "&f&lDémarrage"
    rules: "&f&lRègles et actions"
    tools: "&f&lOutils"
    admin: "&f&lAdministration"
  entry: " &b{usage} &8- &7{desc}"
  footer: "&8&m--------------------------------------"
  dashboard: "&x&9&c&a&8&f&f&lNeoModeration &8v{version} | &f{mode} &8| &7Cloud : &f{cloud} &8| &7Détections : &b{total}"
  page: "&8Page {page}/2 | &7essayez &b/nmod help {next}"
  hint: "&8Cliquez sur une commande pour l'exécuter; survolez une ligne pour l'aide"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <clé>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    reload: "/nmod reload"
    on: "/nmod on"
    off: "/nmod off"
  desc:
    help: "afficher ce menu"
    setup: "activer la modération cloud"
    status: "protection en un coup d'œil"
    mode: "monitor ou enforce"
    preset: "ajuster les catégories cloud"
    word: "mots bloqués"
    url: "liens bloqués"
    allow: "exceptions prioritaires"
    action: "sanctions à la détection"
    surface: "panneaux, livres, enclumes, commandes"
    test: "aperçu sûr, n'agit jamais"
    doctor: "diagnostiquer la configuration"
    cases: "historique des détections"
    usage: "crédits et limites cloud"
    privacy: "quelles données vont où"
    key: "définir ou effacer la clé API"
    reload: "recharger la configuration"
    on: "activer la modération"
    off: "désactiver la modération"
    trial: "activer l'essai cloud de 14 jours"
setup:
  usage: "{prefix} &cUtilisation : &e/{label} setup <apiKey>&7. Ou exécutez &e/{label} trial &7pour un essai cloud de 14 jours (&f{url}&7)."
  done: "{prefix} &aClé API enregistrée. &7Exécutez &e/nmod doctor &7pour vérifier l'authentification et les crédits, puis &e/nmod test hello&7. Les tests n'exécutent aucune action."
trial:
  pending: "{prefix} &eUne demande d'essai cloud est déjà en cours. Patientez."
  configuration-changed: "{prefix} &eLa configuration cloud a changé pendant l'activation. Vos paramètres actuels ont été conservés; exécutez /nmod trial status."
  already-configured: "{prefix} &cCe serveur a déjà une clé API configurée. &7Exécutez &e/nmod trial status &7ou &e/nmod doctor &7pour la vérifier."
  requesting: "{prefix} &7Connexion à Neomechanical pour activer votre essai cloud de 14 jours..."
  activated: "{prefix} &aEssai cloud de 14 jours activé (expire le &f{expires}&a). Les vérifications cloud commencent en mode monitor. Réclamez cet espace sur &f{url}&a ou exécutez &e/nmod doctor &apour vérifier."
  already-claimed: "{prefix} &cCette installation a déjà utilisé son essai de 14 jours. Obtenez une clé API sur &f{url}"
  rate-limited: "{prefix} &cLimite de demandes d'essai atteinte pour ce réseau. Réessayez plus tard ou inscrivez-vous sur &fhttps://neomechanical.com/signup?src=neomoderation"
  failed: "{prefix} &cImpossible d'activer l'essai : &e{error}"
  status-no-key: "{prefix} &eAucune clé API configurée. &7Exécutez &e/nmod trial &7pour un essai de 14 jours, ou inscrivez-vous sur &f{url}"
  status-checking: "{prefix} &7Vérification de l'état de l'essai cloud..."
  status-active: "{prefix} &aEssai cloud actif &8(&f{days} &7jour(s) restants, expire le &f{expires}&8)&7. Passez à un plan sur &f{url}"
  status-expired: "{prefix} &cVotre essai cloud de 14 jours a expiré le &f{expires}&c. &7Passez à un plan sur &f{url} &7et exécutez &e/nmod setup <key>&7."
  status-standard: "{prefix} &aClé d'espace Neomechanical standard active. &7Exécutez &e/nmod usage &7pour voir vos crédits et limites."
toggle:
  on: "{prefix} &7La modération a été &aACTIVÉE&7."
  off: "{prefix} &7La modération a été &cDÉSACTIVÉE&7."
key:
  usage: "{prefix} &cUtilisation : &e/{label} key <set|clear> [apiKey]"
  saved: "{prefix} &aClé API enregistrée. &7Exécutez &e/nmod doctor &7pour vérifier l'authentification et les crédits, puis &e/nmod test hello&7."
  cleared: "{prefix} &eClé API supprimée. Seules les règles locales s'appliquent."
status:
  enabled: "&7État : &f{value}"
  mode: "&7Mode local : &f{value}"
  cloud: "&7Vérifications cloud : &f{value}"
