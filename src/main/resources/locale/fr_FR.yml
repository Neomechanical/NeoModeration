# Textes de NeoModeration : français.
#
# Modifiez n'importe quel texte puis lancez /nmod reload. Un texte que vous
# modifiez reste le vôtre : les mises à jour ne remplacent que les textes jamais
# modifiés. Le plugin remplit les mots entre {accolades}. Les couleurs sont
# définies une fois sous "colors" et utilisées sous la forme {#nom}.

colors:
  brand: "&x&9&c&a&8&f&f"
  safe: "&x&3&e&c&f&9&a"
  review: "&x&f&5&b&5&4&a"
  risk: "&x&f&f&7&a&7&0"
  text: "&f"
  muted: "&7"
  faint: "&8"

prefix: "{#faint}[{#brand}NeoMod{#faint}]"

format:
  date: "d MMMM yyyy"

label:
  "on": "oui"
  "off": "non"
  none: "aucun"
  blocking: "blocage"
  alert-only: "alerte seulement"
  not-armed: "rien à vérifier"
  and: " et en "
  list-separator: ", en "

error:
  no-permission: "{prefix} {#muted}Vous n'avez pas la permission d'utiliser NeoModeration."
  no-api-key: "{prefix} {#muted}Il faut une clé cloud pour cela. Lancez {#brand}/nmod trial{#muted} pour un essai gratuit de 14 jours, ou créez une clé sur {#brand}{url}{#muted} puis lancez {#brand}/nmod setup <clé>{#muted}."
  api-key-too-long: "{prefix} {#risk}Cette clé dépasse {max} caractères."
  rule-too-long: "{prefix} {#risk}Cela dépasse {max} caractères."
  player-unknown: "{prefix} {#risk}Aucun joueur nommé {#text}{player}{#risk} n'a joué ici."
  unknown-command: "{prefix} {#risk}/{label} {command} n'existe pas. {#muted}Voici ce qui existe :"
  admin-only: "{prefix} {#muted}Seuls les administrateurs peuvent utiliser /{label} {command}."

help:
  section:
    start: "{#text}&lPour commencer"
    rules: "{#text}&lRègles et actions"
    tools: "{#text}&lOutils"
    admin: "{#text}&lAdministration"
  footer: "{#faint}&m                                        "
  dashboard: "{#brand}&lNeoModeration{#faint} {version}{#muted}. Règles locales : {#text}{mode}{#muted}, cloud : {#text}{cloud}{#muted}, {#text}{total}{#muted} détections depuis le démarrage"
  page: "{#faint}Page {page} sur 2. {#muted}Suite : {#brand}/nmod help {next}"
  hint: "{#faint}Cliquez sur une commande pour la lancer ou la mettre dans votre chat. Survolez-la pour voir ce qu'elle fait."
  hint-console: "{#faint}Tapez l'une de ces commandes pour la lancer."
  entry-usage: "  {#brand}{usage}"
  entry-desc: "  {#muted}{desc}"
  entry-hover: "{#brand}{usage}\n{#muted}{desc}"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <clé>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    discord: "/nmod discord"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    mute: "/nmod mute <joueur>"
    unmute: "/nmod unmute <joueur>"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    cloudmode: "/nmod cloudmode"
    reload: "/nmod reload"
    "on": "/nmod on"
    "off": "/nmod off"
  desc:
    trial: "ce que fait un essai cloud gratuit de 14 jours"
    setup: "connecter une clé cloud"
    status: "ce qui est protégé en ce moment"
    mode: "bloquer, ou seulement alerter l'équipe"
    preset: "la sévérité du cloud"
    word: "mots interdits"
    url: "liens bloqués"
    allow: "exceptions toujours prioritaires"
    action: "ce qui se passe après un blocage"
    surface: "panneaux, livres, noms d'objets et commandes"
    discord: "envoyer les alertes dans un salon Discord"
    test: "essayer un message sans risque"
    doctor: "trouver les problèmes de configuration"
    cases: "ce qui a été détecté, et chez qui"
    mute: "rendre un joueur muet un moment"
    unmute: "rendre la parole à un joueur muet"
    usage: "crédits et limites du cloud"
    privacy: "quelles données vont où"
    key: "remplacer ou retirer la clé cloud"
    cloudmode: "bloquer sur décision du cloud, ou seulement alerter"
    reload: "recharger la configuration et les textes"
    "on": "activer la modération"
    "off": "désactiver la modération"

setup:
  usage: "{prefix} {#muted}Lancez {#brand}/{label} setup <clé>{#muted} avec une clé de {#brand}{url}{#muted}, ou {#brand}/{label} trial{#muted} pour un essai gratuit de 14 jours."
  done: "{prefix} {#safe}Clé enregistrée. {#muted}Vérifiez-la avec {#brand}/nmod doctor{#muted}, puis avec {#brand}/nmod test hello{#muted}."

key:
  usage: "{prefix} {#muted}Utilisez {#brand}/{label} key set <clé>{#muted} ou {#brand}/{label} key clear{#muted}."
  saved: "{prefix} {#safe}Clé enregistrée. {#muted}Vérifiez-la avec {#brand}/nmod doctor{#muted}."
  cleared: "{prefix} {#muted}Clé retirée. Seules les règles locales fonctionnent désormais."

trial:
  pending: "{prefix} {#muted}Un essai est déjà en train de démarrer. Attendez qu'il se termine."
  explain-title: "{prefix} {#brand}Un essai cloud gratuit de 14 jours{#muted}, sans compte à créer."
  explain-sends: "  {#muted}Pendant l'essai, chaque message du chat et chaque image de carte part chez Neomechanical avec le pseudo et l'UUID du joueur pour être vérifié. Les messages et les images ne sont ni conservés ni utilisés pour l'entraînement."
  explain-monitor: "  {#muted}Les décisions du cloud ne font qu'alerter l'équipe tant que vous n'avez pas lancé {#brand}/nmod cloudmode enforce{#muted}. Vos listes de mots continuent de fonctionner comme maintenant."
  start-button: "  {#brand}[Démarrer l'essai gratuit]"
  start-hover: "{#muted}Lance {command}"
  start-console: "  {#muted}Lancez {#brand}{command}{#muted} pour le démarrer."
  configuration-changed: "{prefix} {#review}Les réglages cloud ont changé pendant le démarrage de l'essai, donc les vôtres ont été gardés. {#muted}Lancez {#brand}/nmod trial{#muted} pour les voir."
  requesting: "{prefix} {#muted}Démarrage de votre essai cloud gratuit de 14 jours..."
  activated: "{prefix} {#safe}Votre essai cloud de 14 jours est actif jusqu'au {#text}{expires}{#safe}."
  activated-monitor: "{prefix} {#muted}Au début, les décisions du cloud ne font qu'alerter l'équipe. Lancez {#brand}/nmod cloudmode enforce{#muted} quand vous leur faites confiance."
  moderation-off: "{prefix} {#review}La modération est désactivée, donc rien n'est encore vérifié. {#muted}Lancez {#brand}/nmod on{#muted} quand vous êtes prêt."
  already-claimed: "{prefix} {#risk}Ce serveur a déjà utilisé son essai gratuit. {#muted}Créez un compte gratuit sur {#brand}{url}{#muted} pour avoir une clé."
  rate-limited: "{prefix} {#risk}Trop d'essais ont été démarrés depuis ce réseau aujourd'hui. {#muted}Réessayez demain, ou inscrivez-vous sur {#brand}{url}{#muted}."
  failed: "{prefix} {#risk}L'essai n'a pas démarré : {error}."
  status-failed: "{prefix} {#risk}Impossible de lire l'essai cloud : {error}."
  error:
    transport: "Neomechanical est injoignable"
    server: "le service d'essai a rencontré une erreur"
    invalid-response: "le service d'essai a envoyé une réponse que cette version ne sait pas lire"
    forbidden: "le service d'essai a refusé cette installation"
    key-rejected: "la clé a été refusée"
    invalid-endpoint: "moderation.api.endpoint n'est pas une adresse valide"
  status-no-key: "{prefix} {#muted}Pas encore de clé cloud. Lancez {#brand}/nmod trial{#muted} pour un essai gratuit de 14 jours."
  status-checking: "{prefix} {#muted}Vérification de l'essai cloud..."
  status-active: "{prefix} {#safe}Essai cloud jusqu'au {#text}{expires}{#safe}. {#muted}Jours restants : {#text}{days}"
  status-caught: "{prefix} {#muted}Détecté par le cloud pendant l'essai : {#text}{count}"
  status-caught-startup: "{prefix} {#muted}Détecté par le cloud depuis le démarrage : {#text}{count}"
  status-expired: "{prefix} {#risk}L'essai cloud s'est terminé le {#text}{expires}{#risk}. {#muted}Les règles locales fonctionnent toujours. Pour garder les vérifications cloud, créez un compte gratuit, puis une clé, et lancez {#brand}/nmod setup <clé>{#muted}."
  status-revoked: "{prefix} {#risk}L'essai cloud a été arrêté. {#muted}Les règles locales fonctionnent toujours. Pour garder les vérifications cloud, créez un compte gratuit, puis une clé, et lancez {#brand}/nmod setup <clé>{#muted}."
  status-credits: "{prefix} {#review}Les crédits de l'essai sont épuisés. {#muted}Gardez-le d'abord dans un compte gratuit, puis ajoutez-y des crédits."
  status-standard: "{prefix} {#safe}Ce serveur utilise une clé Neomechanical complète. {#muted}Lancez {#brand}/nmod usage{#muted} pour voir les crédits."
  keep-button: "  {#brand}[Garder la modération cloud]"
  keep-in-game: "  {#muted}Pour garder l'essai, lancez {#brand}/nmod trial status{#muted} en jeu et cliquez sur {#brand}[Garder la modération cloud]{#muted}. La première personne qui ouvre ce lien obtient l'essai. Le lien n'apparaît donc jamais dans le journal du serveur."
  create-account-button: "  {#brand}[Créer un compte gratuit]"
  keep-hover: "{#muted}Ouvre {url}"
  cta-button: "  {#brand}[Essai cloud gratuit de 14 jours]"
  cta-hover: "{#muted}Lance /nmod trial. Aucun compte nécessaire."

cloud-plan:
  console-trial-ended: "L'essai cloud gratuit s'est terminé le {date}. Les règles locales fonctionnent toujours. Pour garder les vérifications cloud, créez un compte gratuit sur {url}, créez une clé, puis lancez /nmod setup <clé>."
  console-trial-revoked: "L'essai cloud a été arrêté. Les règles locales fonctionnent toujours. Pour garder les vérifications cloud, créez un compte gratuit sur {url}, créez une clé, puis lancez /nmod setup <clé>."
  console-trial-credits: "Les crédits de l'essai cloud gratuit sont épuisés. Les règles locales fonctionnent toujours. Pour ajouter des crédits, gardez d'abord l'essai dans un compte gratuit. Lancez /nmod trial status en jeu et cliquez sur [Garder la modération cloud]."
  console-auth: "La modération cloud a refusé la clé d'API. Créez-la ou remplacez-la sur {url}, puis lancez /nmod setup <clé>."
  console-credits: "La modération cloud n'a plus de crédits. Ajoutez-en sur {url}, puis lancez /nmod test <message>."
  join-trial-ending: "{prefix} {#review}Votre essai cloud gratuit se termine le {#text}{date}{#review}. {#muted}{caught}Gardez-le dans un compte gratuit :"
  join-trial-ended: "{prefix} {#risk}L'essai cloud gratuit s'est terminé le {#text}{date}{#risk}. {#muted}{caught}Les règles locales fonctionnent toujours. Pour garder les vérifications cloud, créez un compte gratuit, puis une clé, et lancez {#brand}/nmod setup <clé>{#muted}."
  join-trial-revoked: "{prefix} {#risk}L'essai cloud a été arrêté. {#muted}{caught}Les règles locales fonctionnent toujours. Pour garder les vérifications cloud, créez un compte gratuit, puis une clé, et lancez {#brand}/nmod setup <clé>{#muted}."
  join-trial-credits: "{prefix} {#review}Les crédits de l'essai cloud gratuit sont épuisés. {#muted}{caught}Les règles locales fonctionnent toujours. Gardez l'essai dans un compte gratuit pour en ajouter :"
  caught-during-trial: "Détecté par le cloud pendant l'essai : {count}."
  caught-since-startup: "Détecté par le cloud depuis le démarrage : {count}."

toggle:
  "on": "{prefix} {#safe}La modération est activée."
  "off": "{prefix} {#risk}La modération est désactivée. {#muted}Rien n'est vérifié tant que vous n'avez pas lancé {#brand}/nmod on{#muted}."

