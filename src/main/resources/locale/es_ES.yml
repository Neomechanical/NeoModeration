  data-text: "cada mensaje del chat"
  data-maps: "cada imagen de mapa"
  data-both: "cada mensaje del chat e imagen de mapa"
  no-cloud: "  {#muted}No hay clave de la nube, así que ningún mensaje ni mapa va a la nube."
  cloud-off: "  {#muted}Hay una clave guardada, pero ninguna revisión en la nube está activada, así que no se envía nada."
  retention: "  {#muted}Las solicitudes a la nube van marcadas como {#text}no_store{#muted}: no se guardan ni se usan para entrenar."
