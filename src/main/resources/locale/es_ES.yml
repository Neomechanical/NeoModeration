  cases-no-preview: ", sin el texto de los mensajes"
  discord: "  {#muted}Las alertas en Discord envían el jugador y la regla a tu webhook, {#text}{message}{#muted}."
  discord-message: "con un extracto del mensaje"
  discord-no-message: "sin el texto del mensaje"
