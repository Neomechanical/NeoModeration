  cloud-skipped-categories: "  {#muted}Nube: {#faint}todas las categorías están desactivadas"
  cloud-skipped-circuit: "  {#muted}Nube: {#faint}en pausa tras varios errores. {#brand}/nmod reload{#muted} lo vuelve a intentar ya."
  would-allowed: "  {#muted}Resultado: {#safe}permitido"
