    forbidden: "el servicio de pruebas no aceptó esta instalación"
    invalid-endpoint: "moderation.api.endpoint no es una dirección válida"
  status-no-key: "{prefix} {#muted}Todavía no hay clave de la nube. Ejecuta {#brand}/nmod trial{#muted} para una prueba gratis de 14 días."
  status-checking: "{prefix} {#muted}Comprobando la prueba en la nube..."
  status-active: "{prefix} {#safe}Prueba en la nube hasta el {#text}{expires}{#safe}. {#muted}Días restantes: {#text}{days}"
  status-caught: "{prefix} {#muted}Detectado por la nube durante la prueba: {#text}{count}"
  status-caught-startup: "{prefix} {#muted}Detectado por la nube desde el inicio: {#text}{count}"
  status-expired: "{prefix} {#risk}La prueba en la nube terminó el {#text}{expires}{#risk}. {#muted}Las reglas locales siguen funcionando."
