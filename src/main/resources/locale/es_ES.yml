# Textos de NeoModeration: español.
#
# Cambia cualquier texto y ejecuta /nmod reload. Un texto que cambies sigue
# siendo tuyo: las actualizaciones solo sustituyen textos que nunca editaste. El
# plugin rellena las palabras entre {llaves}. Los colores se definen una vez en
# "colors" y se usan como {#nombre}.

colors:
  brand: "&x&9&c&a&8&f&f"
  safe: "&x&3&e&c&f&9&a"
  review: "&x&f&5&b&5&4&a"
  risk: "&x&f&f&7&a&7&0"
  text: "&f"
  muted: "&7"
  faint: "&8"

prefix: "{#faint}[{#brand}NeoMod{#faint}]"

format:
  date: "d 'de' MMMM 'de' yyyy"

label:
  "on": "sí"
  "off": "no"
  none: "ninguno"
  blocking: "bloqueo"
  alert-only: "solo aviso"
  not-armed: "nada que revisar"

error:
  no-permission: "{prefix} {#muted}No tienes permiso para usar NeoModeration."
  no-api-key: "{prefix} {#muted}Esto necesita una clave de la nube. Ejecuta {#brand}/nmod trial{#muted} para una prueba gratis de 14 días, o crea una clave en {#brand}{url}{#muted} y ejecuta {#brand}/nmod setup <clave>{#muted}."
  api-key-too-long: "{prefix} {#risk}Esa clave tiene más de {max} caracteres."
  rule-too-long: "{prefix} {#risk}Eso tiene más de {max} caracteres."
  player-unknown: "{prefix} {#risk}Ningún jugador llamado {#text}{player}{#risk} ha jugado aquí."
  unknown-command: "{prefix} {#risk}No existe /{label} {command}. {#muted}Esto es lo que hay:"
  admin-only: "{prefix} {#muted}Solo los administradores pueden usar /{label} {command}."

help:
  section:
    start: "{#text}&lPrimeros pasos"
    rules: "{#text}&lReglas y acciones"
    tools: "{#text}&lHerramientas"
    admin: "{#text}&lAdministración"
  footer: "{#faint}&m                                        "
  dashboard: "{#brand}&lNeoModeration{#faint} {version}{#muted}. Reglas locales: {#text}{mode}{#muted}, nube: {#text}{cloud}{#muted}, {#text}{total}{#muted} detecciones desde el inicio"
  page: "{#faint}Página {page} de 2. {#muted}Más: {#brand}/nmod help {next}"
  hint: "{#faint}Haz clic en un comando para ejecutarlo o ponerlo en tu chat. Pasa el ratón por encima para ver qué hace."
  hint-console: "{#faint}Escribe uno de estos comandos para ejecutarlo."
  entry-usage: "  {#brand}{usage}"
  entry-desc: "  {#muted}{desc}"
  entry-hover: "{#brand}{usage}\n{#muted}{desc}"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <clave>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    discord: "/nmod discord"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    mute: "/nmod mute <jugador>"
    unmute: "/nmod unmute <jugador>"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    cloudmode: "/nmod cloudmode"
    reload: "/nmod reload"
    "on": "/nmod on"
    "off": "/nmod off"
  desc:
    trial: "qué hace una prueba gratis de 14 días en la nube"
    setup: "conectar una clave de la nube"
    status: "qué está protegido ahora"
    mode: "bloquear, o solo avisar al staff"
    preset: "lo estricta que es la nube"
    word: "palabras prohibidas"
    url: "enlaces bloqueados"
    allow: "excepciones que siempre ganan"
    action: "qué pasa después de un bloqueo"
    surface: "carteles, libros, nombres de objetos y comandos"
    discord: "enviar alertas a un canal de Discord"
    test: "probar un mensaje sin riesgo"
    doctor: "encontrar problemas de configuración"
    cases: "qué se detectó y de quién"
    mute: "silenciar a un jugador un rato"
    unmute: "dejar que un jugador silenciado vuelva a hablar"
    usage: "créditos y límites de la nube"
    privacy: "qué datos van adónde"
    key: "cambiar o quitar la clave de la nube"
    cloudmode: "bloquear con las decisiones de la nube, o solo avisar"
    reload: "recargar la configuración y los textos"
    "on": "activar la moderación"
    "off": "desactivar la moderación"

setup:
  usage: "{prefix} {#muted}Ejecuta {#brand}/{label} setup <clave>{#muted} con una clave de {#brand}{url}{#muted}, o {#brand}/{label} trial{#muted} para una prueba gratis de 14 días."
  done: "{prefix} {#safe}Clave guardada. {#muted}Compruébala con {#brand}/nmod doctor{#muted} y luego con {#brand}/nmod test hello{#muted}."

key:
  usage: "{prefix} {#muted}Usa {#brand}/{label} key set <clave>{#muted} o {#brand}/{label} key clear{#muted}."
  saved: "{prefix} {#safe}Clave guardada. {#muted}Compruébala con {#brand}/nmod doctor{#muted}."
  cleared: "{prefix} {#muted}Clave quitada. Ahora solo funcionan las reglas locales."

trial:
  pending: "{prefix} {#muted}Ya se está iniciando una prueba. Espera a que termine."
  explain-title: "{prefix} {#brand}Una prueba gratis de 14 días en la nube{#muted}, sin crear cuenta."
  explain-sends: "  {#muted}Mientras dura, cada mensaje del chat e imagen de mapa va a Neomechanical con el nombre y el UUID del jugador para revisarlo. Los mensajes y las imágenes no se guardan ni se usan para entrenar."
  explain-monitor: "  {#muted}Las decisiones de la nube solo avisan al staff hasta que ejecutes {#brand}/nmod cloudmode enforce{#muted}. Tus listas de palabras siguen funcionando como ahora."
  start-button: "  {#brand}[Empezar la prueba gratis]"
  start-hover: "{#muted}Ejecuta {command}"
  start-console: "  {#muted}Ejecuta {#brand}{command}{#muted} para empezarla."
  configuration-changed: "{prefix} {#review}La configuración de la nube cambió mientras empezaba la prueba, así que se mantuvo la tuya. {#muted}Ejecuta {#brand}/nmod trial{#muted} para verla."
  requesting: "{prefix} {#muted}Empezando tu prueba gratis de 14 días en la nube..."
  activated: "{prefix} {#safe}Tu prueba de 14 días en la nube está activa hasta el {#text}{expires}{#safe}."
  activated-monitor: "{prefix} {#muted}Al principio, las decisiones de la nube solo avisan al staff. Ejecuta {#brand}/nmod cloudmode enforce{#muted} cuando confíes en ellas."
  moderation-off: "{prefix} {#review}La moderación está desactivada, así que todavía no se revisa nada. {#muted}Ejecuta {#brand}/nmod on{#muted} cuando quieras."
  already-claimed: "{prefix} {#risk}Este servidor ya usó su prueba gratis. {#muted}Consigue una clave en {#brand}{url}{#muted}."
  rate-limited: "{prefix} {#risk}Hoy se iniciaron demasiadas pruebas desde esta red. {#muted}Vuelve a intentarlo mañana o regístrate en {#brand}{url}{#muted}."
  failed: "{prefix} {#risk}La prueba no empezó: {error}."
