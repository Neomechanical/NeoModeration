  local-clear: "  {#muted}Reglas locales: {#safe}limpio"
  cloud-checking: "  {#muted}Nube: revisando..."
  cloud-flagged: "  {#muted}Nube: {#risk}detectado {#faint}({reason}, {ms} ms)"
  cloud-clear: "  {#muted}Nube: {#safe}limpio {#faint}({ms} ms)"
  cloud-error: "  {#muted}Nube: {#review}sin respuesta {#faint}({ms} ms){#muted}. Ejecuta {#brand}/nmod doctor{#muted}."
  cloud-auth: "  {#muted}Nube: {#risk}clave rechazada{#muted}. Cámbiala en {#brand}{url}{#muted}."
