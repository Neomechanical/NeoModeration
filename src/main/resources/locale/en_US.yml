# NeoModeration messages: English.
#
# Change any text, then run /nmod reload. A text you change stays yours: updates
# only replace texts you never edited. Words in {braces} are filled in by the
# plugin. Colours are set once under "colors" and used as {#name}.

colors:
  brand: "&x&9&c&a&8&f&f"
  safe: "&x&3&e&c&f&9&a"
  review: "&x&f&5&b&5&4&a"
  risk: "&x&f&f&7&a&7&0"
  text: "&f"
  muted: "&7"
  faint: "&8"

prefix: "{#faint}[{#brand}NeoMod{#faint}]"

format:
  date: "d MMMM yyyy"

label:
  "on": "on"
  "off": "off"
  none: "none"
  blocking: "blocking"
  alert-only: "alerting staff only"
  not-armed: "nothing to check"

error:
  no-permission: "{prefix} {#muted}You don't have permission to use NeoModeration."
  no-api-key: "{prefix} {#muted}This needs a cloud key. Run {#brand}/nmod trial{#muted} for a free 14-day trial, or create a key at {#brand}{url}{#muted} and run {#brand}/nmod setup <key>{#muted}."
  api-key-too-long: "{prefix} {#risk}That key is longer than {max} characters."
  rule-too-long: "{prefix} {#risk}That is longer than {max} characters."
  player-unknown: "{prefix} {#risk}No player called {#text}{player}{#risk} has played here."
  unknown-command: "{prefix} {#risk}There is no /{label} {command}. {#muted}Here are the commands:"
  admin-only: "{prefix} {#muted}Only admins can use /{label} {command}."

help:
  section:
    start: "{#text}&lGet started"
    rules: "{#text}&lRules and actions"
    tools: "{#text}&lTools"
    admin: "{#text}&lAdmin"
  footer: "{#faint}&m                                        "
  dashboard: "{#brand}&lNeoModeration{#faint} {version}{#muted}: local rules {#text}{mode}{#muted}, cloud {#text}{cloud}{#muted}, {#text}{total}{#muted} caught since startup"
  page: "{#faint}Page {page} of 2. {#muted}More: {#brand}/nmod help {next}"
  hint: "{#faint}Click a command to run it or to put it in your chat box. Hover over it to see what it does."
  hint-console: "{#faint}Type one of these commands to run it."
  entry-usage: "  {#brand}{usage}"
  entry-desc: "  {#muted}{desc}"
  entry-hover: "{#brand}{usage}\n{#muted}{desc}"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <key>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    discord: "/nmod discord"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    mute: "/nmod mute <player>"
    unmute: "/nmod unmute <player>"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    cloudmode: "/nmod cloudmode"
    reload: "/nmod reload"
    "on": "/nmod on"
    "off": "/nmod off"
  desc:
    trial: "what a free 14-day cloud trial does"
    setup: "connect a cloud key"
    status: "what is protected right now"
    mode: "block, or only alert staff"
    preset: "how strict the cloud is"
    word: "banned words"
    url: "blocked links"
    allow: "exceptions that always win"
    action: "what happens after a block"
    surface: "signs, books, item names and commands"
    discord: "send alerts to a Discord channel"
    test: "try a message safely"
    doctor: "find setup problems"
    cases: "what was caught, and by whom"
    mute: "stop a player chatting for a while"
    unmute: "let a muted player chat again"
    usage: "cloud credits and limits"
    privacy: "what data goes where"
    key: "replace or remove the cloud key"
    cloudmode: "block on cloud decisions, or only alert"
    reload: "reload config and messages"
    "on": "turn moderation on"
    "off": "turn moderation off"

setup:
  usage: "{prefix} {#muted}Run {#brand}/{label} setup <key>{#muted} with a key from {#brand}{url}{#muted}, or {#brand}/{label} trial{#muted} for a free 14-day trial."
  done: "{prefix} {#safe}Key saved. {#muted}Run {#brand}/nmod doctor{#muted} to check it, then {#brand}/nmod test hello{#muted}."

key:
  usage: "{prefix} {#muted}Use {#brand}/{label} key set <key>{#muted} or {#brand}/{label} key clear{#muted}."
  saved: "{prefix} {#safe}Key saved. {#muted}Run {#brand}/nmod doctor{#muted} to check it."
  cleared: "{prefix} {#muted}Key removed. Only local rules run now."

trial:
  pending: "{prefix} {#muted}A trial is already starting. Wait for it to finish."
  explain-title: "{prefix} {#brand}A free 14-day cloud trial{#muted}. No account needed."
  explain-sends: "  {#muted}While it runs, each chat message and map picture goes to Neomechanical with the player's name and UUID to be checked. Messages and pictures are not kept or used for training."
  explain-monitor: "  {#muted}Cloud decisions only alert staff until you run {#brand}/nmod cloudmode enforce{#muted}. Your word lists keep working as they do now."
  start-button: "  {#brand}[Start the free trial]"
  start-hover: "{#muted}Runs {command}"
  start-console: "  {#muted}Run {#brand}{command}{#muted} to begin."
  configuration-changed: "{prefix} {#review}The cloud settings changed while the trial started, so yours were kept. {#muted}Run {#brand}/nmod trial{#muted} to see them."
  requesting: "{prefix} {#muted}Starting your free 14-day cloud trial..."
  activated: "{prefix} {#safe}Your 14-day cloud trial is on until {#text}{expires}{#safe}."
  activated-monitor: "{prefix} {#muted}Cloud decisions alert staff first. Run {#brand}/nmod cloudmode enforce{#muted} when you trust them."
  moderation-off: "{prefix} {#review}Moderation is off, so nothing is checked yet. {#muted}Run {#brand}/nmod on{#muted} when you are ready."
  already-claimed: "{prefix} {#risk}This server already used its free trial. {#muted}Get a key at {#brand}{url}{#muted}."
  rate-limited: "{prefix} {#risk}Too many trials started from this network today. {#muted}Try again tomorrow, or sign up at {#brand}{url}{#muted}."
  failed: "{prefix} {#risk}The trial didn't start: {error}."
  error:
    transport: "Neomechanical could not be reached"
    server: "the trial service had an error"
    invalid-response: "the trial service sent an answer this version cannot read"
    forbidden: "the trial service did not accept this install"
    invalid-endpoint: "moderation.api.endpoint is not a valid address"
  status-no-key: "{prefix} {#muted}No cloud key yet. Run {#brand}/nmod trial{#muted} for a free 14-day trial."
  status-checking: "{prefix} {#muted}Checking the cloud trial..."
  status-active: "{prefix} {#safe}Cloud trial until {#text}{expires}{#safe}. {#muted}Days left: {#text}{days}"
  status-caught: "{prefix} {#muted}Caught by the cloud during the trial: {#text}{count}"
  status-caught-startup: "{prefix} {#muted}Caught by the cloud since startup: {#text}{count}"
  status-expired: "{prefix} {#risk}The cloud trial ended on {#text}{expires}{#risk}. {#muted}Local rules still run."
  status-standard: "{prefix} {#safe}This server uses a full Neomechanical key. {#muted}Run {#brand}/nmod usage{#muted} for credits."
  keep-button: "  {#brand}[Keep cloud moderation]"
  keep-hover: "{#muted}Opens {url}"
  cta-button: "  {#brand}[Free 14-day cloud trial]"
  cta-hover: "{#muted}Runs /nmod trial. No account needed."

toggle:
  "on": "{prefix} {#safe}Moderation is on."
  "off": "{prefix} {#risk}Moderation is off. {#muted}Nothing is checked until {#brand}/nmod on{#muted}."

status:
  enabled: "{#muted}Moderation: {#text}{value}"
  local: "{#muted}Local rules: {#text}{value}"
  rules: "{#muted}Banned words: {#text}{words}{#muted}, blocked links: {#text}{urls}{#muted}, exceptions: {#text}{exceptions}"
  packs: "{#muted}Language packs: {#text}{value}"
  server-ads: "{#muted}Ads for other servers: {#text}{value}"
  checks: "{#muted}Anti-spam {#text}{spam}{#muted}, strikes {#text}{strikes}{#muted}, case history {#text}{cases}"
  surfaces: "{#muted}Signs, books, item names, commands: {#text}{value}"
  actions: "{#muted}After a block: {#text}{value}"
  alerts: "{#muted}Staff alerts: {#text}{value}"
  discord: "{#muted}Discord alerts: {#text}{value}"
  cloud: "{#muted}Cloud: {#text}{value}"
  cloud-no-key: "{#muted}Cloud: {#text}no key{#muted}. Run {#brand}/nmod trial{#muted} for a free 14-day trial."
  cloud-no-key-staff: "{#muted}Cloud: {#text}no key{#muted}."
  cloud-unverified: "{#muted}Last cloud check: {#text}none since startup{#muted}. Run {#brand}/nmod test hello{#muted}."
  cloud-ready: "{#muted}Last cloud check: {#safe}worked{#muted}."
  cloud-auth: "{#muted}Last cloud check: {#risk}key rejected{#muted}. Replace it at {#brand}{keysUrl}{#muted}."
  cloud-credits: "{#muted}Last cloud check: {#risk}out of credits{#muted}. Add some at {#brand}{billingUrl}{#muted}."
  cloud-request-error: "{#muted}Last cloud check: {#risk}request refused{#muted}. Run {#brand}/nmod doctor{#muted}."
  cloud-transient: "{#muted}Last cloud check: {#review}no answer{#muted}. Local rules still run; {#brand}/nmod reload{#muted} retries now."
  cloud-busy: "{#muted}Messages the cloud had no time to check since startup (chat was busy): {#text}{count}"
  value:
    alerts-preview: "on, with the message"
    alerts-hidden: "on, message hidden"
    server-ads-on: "blocked"
    server-ads-off: "allowed"
    surfaces-off: "not checked"
    surfaces-on: "{count} of 4 checked"
    cloud-checks: "{mode}, categories on: {categories}{maps}"
    cloud-maps: " plus map art"
    cloud-nothing: "key saved, no checks on"
    local-monitor: "alerting staff only (monitor)"
    local-enforce: "blocking"
    local-surfaces-only: "blocking where checked; chat alerts only"

reload:
  done: "{prefix} {#safe}Reloaded config.yml and the messages."

rules:
  kind:
    word: "banned words"
    url: "blocked links"
    allowed-word: "allowed phrases"
    allowed-url: "allowed links"
  usage: "{prefix} {#muted}Use {#brand}/{label} {command} <add|remove|list> [value]{#muted}."
  list: "{prefix} {#muted}{kind}: {#text}{values}"
  list-packs: "{prefix} {#muted}Words from the language packs ({packs}): {#text}{count}"
  value-required: "{prefix} {#risk}Add the word or link after the command."
  added: "{prefix} {#safe}Added {#text}{value}{#safe} to {kind}."
  removed: "{prefix} {#safe}Removed {#text}{value}{#safe} from {kind}."
  already-there: "{prefix} {#muted}{#text}{value}{#muted} is already in {kind}."
  not-there: "{prefix} {#muted}{#text}{value}{#muted} is not in {kind}."
  in-pack: "{prefix} {#muted}{#text}{value}{#muted} comes from a language pack, so it still blocks. {#brand}/{label} allow word add {value}{#muted} lets it through in every message, from every player."

action:
  usage: "{prefix} {#muted}Use {#brand}/{label} action <list|add|remove|reset>{#muted}."
  add-usage: "{prefix} {#muted}Use {#brand}/{label} action add <clear|mute|kick|ban> [duration]{#muted}."
  remove-usage: "{prefix} {#muted}Use {#brand}/{label} action remove <clear|mute|kick|ban>{#muted}."
  list-title: "{prefix} {#muted}After a block:"
  list-item: "  {#faint}{index}. {#text}{value}"
  empty: "{prefix} {#muted}After a block nothing else happens: no mute, kick or chat clear."
  added: "{prefix} {#safe}After a block: {#text}{value}{#safe}."
  removed: "{prefix} {#safe}Removed {#text}{value}{#safe}."
  missing: "{prefix} {#muted}{#text}{value}{#muted} was not set."
  unknown: "{prefix} {#risk}Unknown action {#text}{value}{#risk}. {#muted}Use clear, mute, kick or ban."
  bad-duration: "{prefix} {#risk}{#text}{value}{#risk} is not a duration. {#muted}Try 30s, 5m or 1h (30d at most)."
  reset: "{prefix} {#safe}Actions cleared. {#muted}A block now only blocks. Strikes are set separately."
  default-reason: "Inappropriate chat"
  strike-reason: "Repeated inappropriate chat"
  strike: "strike {count}"
  name:
    clear: "clear everyone's chat"
    mute: "mute for {duration}"
    kick: "kick"
    ban: "ban"
    command: "run /{command}"
    nothing: "nothing else"
  unsafe-name: "Skipped a command action for {player}: a name with a space could add words to the command."

usage:
  fetching: "{prefix} {#muted}Checking your Neomechanical account..."
  title: "{prefix} {#muted}Neomechanical account"
  workspace: "  {#muted}Workspace: {#text}{value}"
  plan: "  {#muted}Plan: {#text}{value}{#muted}, up to {#text}{rpm}{#muted} requests a minute"
  credits: "  {#muted}Credits left: {#text}{value}"
  credits-empty: "  {#muted}Credits left: {#risk}0{#muted}. Add some at {#brand}{url}{#muted}."
  requests: "  {#muted}Requests: {#text}{today}{#muted} today, {#text}{week}{#muted} in 7 days"
  nsfw: "  {#muted}Image checks left today: {#text}{images}{#muted}"
  error: "{prefix} {#review}Neomechanical did not answer. {#muted}Try again in a minute."
  error-auth: "{prefix} {#risk}The key was rejected. {#muted}Replace it at {#brand}{keysUrl}{#muted}."
  error-credits: "{prefix} {#risk}Out of credits. {#muted}Add some at {#brand}{billingUrl}{#muted}."
  error-request: "{prefix} {#risk}The request was refused. {#muted}Run {#brand}/nmod doctor{#muted}."

mapart:
  confiscated: "{prefix} {#risk}That map was removed: its picture is not allowed here."
  blocked: "{prefix} {#risk}That map's picture is not allowed here."
  capped: "{prefix} {#muted}Pictures from {#text}{player}{#muted} are not sent to the cloud for the rest of the hour: the limit in moderation.mapArt.checksPerPlayerPerHour ({#text}{limit}{#muted}) is reached."

mute:
  blocked: "{prefix} {#muted}You are muted for {#text}{duration}{#muted}."
  usage: "{prefix} {#muted}Use {#brand}/{label} mute <player> [duration]{#muted}, for example 10m."
  done: "{prefix} {#safe}Muted {#text}{player}{#safe} for {#text}{duration}{#safe}."
  told: "{prefix} {#muted}You are muted for {#text}{duration}{#muted}."
  unmute-usage: "{prefix} {#muted}Use {#brand}/{label} unmute <player>{#muted}."
  unmuted: "{prefix} {#safe}{#text}{player}{#safe} can chat again."
  not-muted: "{prefix} {#muted}{#text}{player}{#muted} is not muted."
  told-unmuted: "{prefix} {#safe}You can chat again."

notice:
  chat: "{prefix} {#muted}Your message wasn't sent. {why}"
  sign: "{prefix} {#muted}Your sign wasn't saved. {why}"
  book: "{prefix} {#muted}Your book wasn't saved. {why}"
  anvil: "{prefix} {#muted}That name wasn't applied. {why}"
  command: "{prefix} {#muted}That command wasn't sent. {why}"
  censored: "{prefix} {#muted}Part of your message was hidden. {why}"

why:
  word: "It has a word this server blocks."
  link: "It has a link this server blocks."
  server-ad: "It looks like an ad for another server."
  spam-rate: "You're sending messages too fast."
  spam-duplicate: "You already sent that."
  spam-caps: "Please don't write in capitals."
  spam-flood: "It repeats one letter too many times."
  spam-command-rate: "You're sending commands too fast."
  cloud: "It breaks this server's chat rules."

reason:
  word: "banned word \"{detail}\""
  word-split: "\"{detail}\" split over several messages"
  link: "blocked link {detail}"
  any-link: "a link"
  server-ad: "ad for {detail}"
  spam-rate: "too many messages"
  spam-duplicate: "the same message again"
  spam-caps: "mostly capitals"
  spam-flood: "one letter repeated"
  spam-command-rate: "too many commands"
  cloud: "cloud: {detail}"
  cloud-plain: "cloud check"
  map: "map art: {detail}"
  map-plain: "map art"
  other: "{detail}"

category:
  sexual: "sexual content"
  hate: "hate"
  harassment: "harassment"
  violence: "violence"
  scam: "scams"
  spam: "spam"
  illicit: "illicit activity"
  selfHarm: "self-harm"

surface-name:
  chat: "chat"
  sign: "a sign"
  book: "a book"
  anvil: "an item name"
  command: "a command"
  map_art: "map art"
  map_frame: "a framed map"

alert:
  verdict:
    blocked: "{#risk}Blocked"
    censored: "{#review}Censored"
    review: "{#review}Needs review"
  line: "{prefix} {verdict} {#text}{player}{#faint} in {surface}{#muted}: {#text}{message} {#faint}({reason})"
  found: "{prefix} {verdict} {#muted}a framed map at {#text}{message} {#faint}({reason}), found by {player}"
  then: " {#faint}then {#muted}{actions}"
  hidden: "message hidden"
  hover: "{#muted}Click to see {player}'s cases"
  paused-player: "{prefix} {#muted}Alerts about {#text}{player}{#muted} pause while this keeps up. Everything is still logged."
  paused-all: "{prefix} {#muted}Too many alerts at once, so they pause until it calms down. Everything is still logged."
  missed-player: "{prefix} {#muted}Alerts about {#text}{player}{#muted} are back. Missed while paused: {#text}{count}"
  missed-all: "{prefix} {#muted}Alerts are back. Missed while paused: {#text}{count}{#muted}, players: {#text}{players}"

surface:
  title: "{prefix} {#muted}Where local rules apply. Click a setting to change it."
  title-console: "{prefix} {#muted}Where local rules apply."
  chat-row: "  {#text}Chat{#muted}: always checked"
  chat-row-off: "  {#text}Chat{#muted}: not checked (moderation.chat.scanAsyncChat)"
  row: "  {#text}{surface}{#muted}: "
  button: "{#faint}[{#muted}{mode}{#faint}] "
  button-current: "{#faint}[{#brand}{mode}{#faint}] "
  button-hover: "{#muted}Set {surface} to {mode}"
  all-row: "  {#text}All four{#muted}: "
  commands: "  {#muted}Commands checked: {#text}{commands}"
  usage: "{prefix} {#muted}Use {#brand}/{label} surface <sign|book|anvil|command|all> <off|monitor|censor|block>{#muted}."
  updated: "{prefix} {#safe}{surface}: {mode}."
  name:
    sign: "Signs"
    book: "Books"
    anvil: "Item names"
    command: "Commands"
    all: "All four"
  mode:
    "off": "off"
    monitor: "alert only"
    censor: "star out"
    block: "block"

allow:
  usage: "{prefix} {#muted}Use {#brand}/{label} allow <word|url> <add|remove|list> [value]{#muted}."

mode:
  usage: "{prefix} {#muted}Use {#brand}/{label} mode <monitor|enforce>{#muted}."
