stat:
  word: "banned words"
  split-word: "words split over messages"
  link: "blocked links"
  server-ad: "ads for other servers"
  spam: "spam"
  cloud: "cloud checks"
  map: "map art"
  other: "other"

cloudmode:
  usage: "{prefix} {#muted}Use {#brand}/{label} cloudmode <monitor|enforce>{#muted}."
