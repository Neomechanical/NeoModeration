# Shared chat prefix. Every message references it as {prefix}, so you can
# rebrand or recolor the whole plugin from this one line.
prefix: "&8[&x&9&c&a&8&f&fNeoMod&8]"
error:
  no-permission: "{prefix} &cYou do not have permission to use NeoModeration."
  no-api-key: "{prefix} &cNo API key configured. &7Run &e/nmod trial &7for a free 14-day cloud evaluation, or sign up at &f{url} &7and run &e/nmod setup <apiKey>"
  api-key-too-long: "{prefix} &cAPI key is too long (max {max} characters)."
  rule-too-long: "{prefix} &cValue is too long (max {max} characters)."
help:
  title: "&8&m----------&r &x&9&c&a&8&f&f&lNeoModeration &8&m----------"
  section:
    start: "&f&lGetting started"
    rules: "&f&lRules & actions"
    tools: "&f&lTools"
    admin: "&f&lAdmin"
  entry: " &b{usage} &8- &7{desc}"
  footer: "&8&m--------------------------------------"
  dashboard: "&x&9&c&a&8&f&f&lNeoModeration &8v{version} | &f{mode} &8| &7Cloud: &f{cloud} &8| &7Detections: &b{total}"
  page: "&8Page {page}/2 | &7try &b/nmod help {next}"
  hint: "&8Click a command to run it; hover any entry for help"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <key>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    reload: "/nmod reload"
    on: "/nmod on"
    off: "/nmod off"
  desc:
    help: "show this menu"
    setup: "enable cloud moderation"
    status: "protection at a glance"
    mode: "monitor or enforce"
    preset: "tune cloud categories"
    word: "banned words"
    url: "banned links"
    allow: "exceptions that always win"
    action: "punishments on detect"
    surface: "signs, books, anvils, commands"
    test: "safe preview, never acts"
    doctor: "diagnose your setup"
    cases: "detection history"
    usage: "cloud credits and limits"
    privacy: "what data goes where"
    key: "set or clear the API key"
    reload: "reload config from disk"
    on: "enable moderation"
    off: "disable moderation"
    trial: "activate 14-day cloud trial"
setup:
  usage: "{prefix} &cUsage: &e/{label} setup <apiKey>&7. Or run &e/{label} trial &7for a 14-day cloud trial (&f{url}&7)."
  done: "{prefix} &aAPI key saved. &7Run &e/nmod doctor &7to verify authentication and credits, then &e/nmod test hello&7. Tests never execute actions."
trial:
  pending: "{prefix} &eA cloud trial request is already running. Wait for its result."
  configuration-changed: "{prefix} &eCloud configuration changed during activation. Your current settings were kept; run /nmod trial status."
  already-configured: "{prefix} &cThis server already has an API key configured. &7Run &e/nmod trial status &7or &e/nmod doctor &7to check it."
  requesting: "{prefix} &7Connecting to Neomechanical to activate your 14-day cloud trial..."
  activated: "{prefix} &a14-day cloud trial activated (expires &f{expires}&a). Cloud chat and map-art checks start in monitor mode. Claim this workspace at &f{url}&a or run &e/nmod doctor &ato verify."
  already-claimed: "{prefix} &cThis server installation has already used its 14-day trial. Get an API key at &f{url}"
  rate-limited: "{prefix} &cTrial rate limit reached for this network. Try again later or sign up at &fhttps://neomechanical.com/signup?src=neomoderation"
  failed: "{prefix} &cUnable to activate trial: &e{error}"
  status-no-key: "{prefix} &eNo API key configured. &7Run &e/nmod trial &7for a 14-day cloud trial, or sign up at &f{url}"
  status-checking: "{prefix} &7Checking cloud trial status..."
  status-active: "{prefix} &aCloud trial active &8(&f{days} &7day(s) left, expires &f{expires}&8)&7. Upgrade at &f{url}"
  status-expired: "{prefix} &cYour 14-day cloud trial expired on &f{expires}&c. &7Upgrade at &f{url} &7and run &e/nmod setup <key>&7."
  status-standard: "{prefix} &aUsing a standard Neomechanical workspace key. &7Run &e/nmod usage &7for credits and limits."
  cta-button: "  &a[Start free 14-day cloud trial] &8(/nmod trial)"
toggle:
  on: "{prefix} &7Moderation has been &aENABLED&7."
  off: "{prefix} &7Moderation has been &cDISABLED&7."
key:
  usage: "{prefix} &cUsage: &e/{label} key <set|clear> [apiKey]"
  saved: "{prefix} &aAPI key saved. &7Run &e/nmod doctor &7to verify authentication and credits, then &e/nmod test hello&7."
  cleared: "{prefix} &eAPI key removed. Only local rules will apply."
status:
  enabled: "&7Status: &f{value}"
  mode: "&7Local mode: &f{value}"
  cloud: "&7Cloud checks: &f{value}"
  cloud-no-key: "&7Cloud setup: &eno key&7. Run &e/nmod trial &7or get a key at &f{url} &7-> &e/nmod setup <key>&7."
  cloud-unverified: "&7Moderation-event health: &enot verified since startup/reload&7. Run &e/nmod test hello&7."
  cloud-ready: "&7Moderation-event health: &alast moderation request succeeded&7. Run &e/nmod usage &7to see account credits."
  cloud-auth: "&7Moderation-event health: &cAPI key rejected&7. Replace it at &f{keysUrl}&7, then run &e/nmod setup <key>&7."
  cloud-credits: "&7Moderation-event health: &cinsufficient credits&7. Add credits at &f{billingUrl}&7, then run &e/nmod test hello&7."
  cloud-request-error: "&7Moderation-event health: &crequest rejected&7, but the key was not classified as invalid. Check the endpoint with &e/nmod doctor&7, then run &e/nmod test hello&7."
  cloud-transient: "&7Moderation-event health: &etemporary network/server error&7. Local rules still run; use &e/nmod reload &7to retry a paused circuit."
  rules: "&7Configured local rules: &b{words} &7words, &b{urls} &7links"
  allow: "&7Exceptions: &b{words} &7allowed phrases, &b{urls} &7allowed links"
  actions: "&7On detect: &c{value}"
  alerts: "&7Staff alerts: &f{value}"
  coverage: "&7Anti-spam: &f{spam} &8| &7Strikes: &f{strikes} &8| &7Surfaces: &f{surfaces}/4 &8| &7Cases: &f{cases}"
  detections: "&7Detections since startup: &b{value}"
reload:
  done: "{prefix} &aConfiguration reloaded successfully."
rules:
  usage: "{prefix} &cUsage: &e/{label} {kind} <add|remove|list> [value]"
  list: "{prefix} &7Blocked {kind}s: &b{values}"
  value-required: "{prefix} &cPlease specify a value to add or remove."
  updated: "{prefix} &a{action} {kind}: &f{value}"
  unchanged: "{prefix} &eNo changes made for {kind}: &f{value}"
action:
  usage: "{prefix} &cUsage: &e/{label} action <list|add|remove|reset>"
  add-usage: "{prefix} &cUsage: &e/{label} action add <clear|mute|kick|ban> [duration]"
  remove-usage: "{prefix} &cUsage: &e/{label} action remove <clear|mute|kick|ban>"
  list-title: "&8&m----------&r &c&lPunishment Actions &8&m----------"
  list-item: "&7{index}. &c{value}"
  empty: "{prefix} &eNo actions configured. Messages will be blocked without punishment."
  added: "{prefix} &aAction added: &f{value}"
  removed: "{prefix} &eAction removed: &f{value}"
  missing: "{prefix} &cThat action is not currently configured: &f{value}"
  unknown: "{prefix} &cUnknown action. &7Use clear, mute, kick, or ban."
  bad-duration: "{prefix} &cInvalid duration: &f{value}&c. &7Try 30s, 5m, or 1h (max 30d)."
  reset: "{prefix} &aExtra actions cleared: matching messages are blocked without an automatic punishment. &7Strike escalation is configured separately."
usage:
  fetching: "{prefix} &7Fetching usage from Neomechanical..."
  title: "&8&m----------&r &x&9&c&a&8&f&f&lNeomechanical Usage &8&m----------"
  workspace: "&7Workspace: &f{value}"
  plan: "&7Plan: &f{value} &8(&f{rpm}&7/min limit&8)"
  credits: "&7Credits left: &a{value}"
  credits-empty: "&7Credits left: &c0&7. Add credits at &f{url}&7, then run &e/nmod test hello&7."
  requests: "&7Requests: &f{today} &7today &8/ &f{week} &7last 7 days"
  nsfw: "&7NSFW today (left/cap): &f{images} &7img, &f{text} &7txt, &f{videos} &7vid"
  error: "{prefix} &cFailed to fetch API usage due to a temporary network/server error. &7Try again later."
  error-auth: "{prefix} &cThe API key was rejected. &7Replace it at &f{keysUrl}&7, then run &e/nmod setup <key>&7."
  error-credits: "{prefix} &cInsufficient credits. &7Add credits at &f{billingUrl}&7, then run &e/nmod test hello&7."
  error-request: "{prefix} &cThe usage request was rejected, but the key was not classified as invalid. &7Run &e/nmod doctor&7."
mapart:
  confiscated: "{prefix} &cThat map contains inappropriate content and has been removed."
  blocked: "{prefix} &cThat map is flagged as inappropriate and cannot be used."
mute:
  blocked: "&cYou are muted for &f{duration}&c."
alert:
  monitor: "{prefix} &e&lMONITOR &7{player} &8[&7{surface}&8] &f{message} &8(&7{reason}&8) &7would trigger: &e{actions}"
  enforce: "{prefix} &c&lFLAGGED &7{player} &8[&7{surface}&8] &f{message} &8(&7{reason}&8) &7-> &c{actions}"
surface:
  blocked: "{prefix} &cThat text contains blocked content."
  title: "&8&m----------&r &x&9&c&a&8&f&f&lExtra Surfaces &8&m----------"
  row: "&b{surface}&8: &f{mode}"
  commands: "&7Scanned commands: &f{commands}"
  hint: "&7Change with &e/{label} surface <sign|book|anvil|command|all> <off|monitor|censor|block>"
  usage: "{prefix} &cUsage: &e/{label} surface <sign|book|anvil|command|all> <off|monitor|censor|block>"
  updated: "{prefix} &aSurface &f{surface} &aset to &f{mode}&a."
allow:
  usage: "{prefix} &cUsage: &e/{label} allow <word|url> <add|remove|list> [value]"
mode:
  usage: "{prefix} &cUsage: &e/{label} mode <monitor|enforce>"
  current: "{prefix} &7Mode: &f{value}"
  stats: "{prefix} &7Detections since startup (&f{hours}h&7): &b{total}"
  stats-line: "&8  - &7{reason}: &b{count}"
  set-monitor: "{prefix} &eLocal monitor mode on. &7Local detections alert staff without blocking or punishment. Cloud mode is separate."
  set-enforce: "{prefix} &aEnforce mode on. &7Flagged content is now blocked and configured actions run."
cloudmode:
  usage: "{prefix} &cUsage: &e/{label} cloudmode <monitor|enforce>"
  current: "{prefix} &7Cloud mode: &f{value}"
  set-monitor: "{prefix} &eCloud monitor mode on. &7Cloud decisions are alerted only; your local rules are unaffected."
  set-enforce: "{prefix} &aCloud enforce mode on. &7Cloud decisions now block and use your configured extra actions."
test:
  would-block-unavailable: "{prefix} &eResult: blocked while cloud is unavailable; no strikes or player punishments."
  usage: "{prefix} &cUsage: &e/{label} test <message>&7. First check: &e/{label} test badword&7. Preview never blocks or punishes."
  title: "{prefix} &7Testing: &f{message}"
  scope: "{prefix} &8Word/URL and cloud-text preview only: rate, repeats, caps, character runs, commands, and maps need live events."
  disabled: "{prefix} &7Moderation is &cdisabled&7, so the message would not be checked."
  chat-disabled: "{prefix} &7Chat scanning is &cdisabled&7, so this message would not be checked. Other configured surfaces may still run."
  local-flagged: "{prefix} &7Local rules: &cFLAGGED &8(&7{reason}&8)"
  local-clear: "{prefix} &7Local rules: &aclear"
  cloud-checking: "{prefix} &7Cloud: &7checking..."
  cloud-flagged: "{prefix} &7Cloud: &cFLAGGED &8(&7{ms}ms&8)"
  cloud-clear: "{prefix} &7Cloud: &aclear &8(&7{ms}ms&8)"
  cloud-error: "{prefix} &7Cloud: &etemporary network/server error &8(&7{ms}ms&8)&7. Run &e/nmod doctor&7."
  cloud-auth: "{prefix} &7Cloud: &cAPI key rejected &8(&7{ms}ms&8)&7. Replace it at &f{url}&7, then run &e/nmod setup <key>&7."
  cloud-credits: "{prefix} &7Cloud: &cinsufficient credits &8(&7{ms}ms&8)&7. Add credits at &f{url}&7, then run &e/nmod test hello&7."
  cloud-request-error: "{prefix} &7Cloud: &crequest rejected &8(&7{ms}ms&8)&7, but the key was not classified as invalid. Run &e/nmod doctor&7."
  cloud-skipped-local: "{prefix} &7Cloud: &8skipped (local rules already detected it)"
  cloud-skipped-key: "{prefix} &7Cloud: &8skipped (no API key). &7Run &e/nmod trial &7for a free 14-day evaluation, or get a key at &f{url} &7-> &e/nmod setup <key>&7."
  cloud-skipped-categories: "{prefix} &7Cloud text: &8skipped (all categories are off). Map-art scanning may still run."
  cloud-skipped-circuit: "{prefix} &7Cloud: &8skipped (paused after errors; /nmod reload to retry)"
  would-allowed: "{prefix} &7Result: &aallowed"
  would-monitor: "{prefix} &7Result: &emonitor alert only &7(no blocking or punishment)"
  would-censor: "{prefix} &7Result: &econtent censored"
  would-enforce: "{prefix} &7Result: &cblocked&7; actions: &c{actions}"
  note: "{prefix} &8This test used one cloud request. No actions were executed."
doctor:
  title: "&8&m----------&r &x&9&c&a&8&f&f&lNeoModeration Doctor &8&m----------"
  pass: "&a[OK] &7{check}&8: &f{detail}"
  warn: "&e[!!] &7{check}&8: &f{detail}"
  fail: "&c[XX] &7{check}&8: &f{detail}"
  checking-cloud: "{prefix} &7Checking the account and usage API (moderation events are reported separately)..."
privacy:
  title: "&8&m----------&r &x&9&c&a&8&f&f&lNeoModeration Privacy &8&m----------"
  headline: "&7Protection: &f{value}"
  local: "&7Local word/URL rules, when armed, run on this server. Their checks do not send content away."
  cloud: "&7Configured cloud checks send &f{data} &7to &f{endpoint} &7with the player name and UUID."
  no-cloud: "&7No API key is set, so no chat or map content is sent off this server."
  cloud-off: "&7An API key is saved, but no cloud text or map checks are armed; no moderation content is sent."
  retention: "&7Cloud requests use &fno_store&7: not retained, not used for training, no analysis details returned."
  timeout: "&7Cloud waits: &f{connect}ms &7connect, &f{read}ms &7read (2.5s hard cap). If unreachable: &f{policy}&7."
  mode: "&7Moderation: &f{value}"
  metrics: "&7bStats technical metrics contain no chat content and can be disabled in &fplugins/bStats/config.yml&7."
cases:
  title: "&8&m----------&r &x&9&c&a&8&f&f&lRecent Cases &8&m----------"
  line: "&8#&b{id} &7{player} &8[&7{surface}&8] &7{reason} &8-> &c{actions} &8({mode}, {ago} ago)"
  preview: " &8> &f{value}"
  empty: "{prefix} &7No cases recorded yet."
  not-found: "{prefix} &cNo case with id &f{id}&c."
  disabled: "{prefix} &7Case history is disabled (moderation.cases.enabled)."
  unavailable: "{prefix} &cCase history is unavailable on this server (no SQLite driver)."
preset:
  usage: "{prefix} &cUsage: &e/{label} preset <family|community|minimal>"
  list-title: "&8&m----------&r &x&9&c&a&8&f&f&lPolicy Presets &8&m----------"
  list-item: "&b{name} &8- &7{summary}"
  applied: "{prefix} &aApplied cloud preset &f{name}&a. &7Categories on: &b{categories}&7. Actions unchanged: &f{actions}&7. Local rules and modes unchanged; cloud checks require an API key."

chat:
  cloud-unavailable: "{prefix} &eCloud moderation is unavailable. Please try again shortly; this is not a player violation."

welcome:
  title: "{prefix} &7Local chat and anti-spam rules are &aactive&7. Click below to configure surfaces or start a free 14-day cloud trial."
  surfaces-btn: "  &b[Configure extra surfaces] &8(/nmod surface)"

