  local-flagged: "  {#muted}Local rules: {#risk}caught {#faint}({reason})"
  local-clear: "  {#muted}Local rules: {#safe}clean"
  cloud-checking: "  {#muted}Cloud: checking..."
  cloud-flagged: "  {#muted}Cloud: {#risk}caught {#faint}({reason}, {ms} ms)"
  cloud-clear: "  {#muted}Cloud: {#safe}clean {#faint}({ms} ms)"
  cloud-error: "  {#muted}Cloud: {#review}no answer {#faint}({ms} ms){#muted}. Run {#brand}/nmod doctor{#muted}."
