# Textos do NeoModeration: português do Brasil.
#
# Mude qualquer texto e rode /nmod reload. Um texto que você mudar continua seu:
# as atualizações só substituem textos que você nunca editou. O plugin preenche
# as palavras entre {chaves}. As cores ficam uma vez em "colors" e são usadas
# como {#nome}.

colors:
  brand: "&x&9&c&a&8&f&f"
  safe: "&x&3&e&c&f&9&a"
  review: "&x&f&5&b&5&4&a"
  risk: "&x&f&f&7&a&7&0"
  text: "&f"
  muted: "&7"
  faint: "&8"

prefix: "{#faint}[{#brand}NeoMod{#faint}]"

format:
  date: "d 'de' MMMM 'de' yyyy"

label:
  "on": "sim"
  "off": "não"
  none: "nenhum"
  blocking: "bloqueio"
  alert-only: "só aviso"
  not-armed: "nada para verificar"
  and: " e "
  list-separator: ", "

error:
  no-permission: "{prefix} {#muted}Você não tem permissão para usar o NeoModeration."
  no-api-key: "{prefix} {#muted}Isso precisa de uma chave da nuvem. Rode {#brand}/nmod trial{#muted} para verificações grátis na nuvem, ou crie uma chave em {#brand}{url}{#muted} e rode {#brand}/nmod setup <chave>{#muted}."
  api-key-too-long: "{prefix} {#risk}Essa chave tem mais de {max} caracteres."
  rule-too-long: "{prefix} {#risk}Isso tem mais de {max} caracteres."
  player-unknown: "{prefix} {#risk}Nenhum jogador chamado {#text}{player}{#risk} jogou aqui ainda."
  unknown-command: "{prefix} {#risk}Não existe /{label} {command}. {#muted}Veja o que existe:"
  admin-only: "{prefix} {#muted}Só administradores podem usar /{label} {command}."

help:
  section:
    start: "{#text}&lPrimeiros passos"
    rules: "{#text}&lRegras e ações"
    tools: "{#text}&lFerramentas"
    admin: "{#text}&lAdministração"
  footer: "{#faint}&m                                        "
  dashboard: "{#brand}&lNeoModeration{#faint} {version}{#muted}. Regras locais: {#text}{mode}{#muted}, nuvem: {#text}{cloud}{#muted}, {#text}{total}{#muted} detecções desde o início"
  page: "{#faint}Página {page} de 2. {#muted}Mais: {#brand}/nmod help {next}"
  hint: "{#faint}Clique num comando para rodá-lo ou colocá-lo no seu chat. Passe o mouse por cima para ver o que ele faz."
  hint-console: "{#faint}Digite um destes comandos para rodá-lo."
  entry-usage: "  {#brand}{usage}"
  entry-desc: "  {#muted}{desc}"
  entry-hover: "{#brand}{usage}\n{#muted}{desc}"
  usage:
    trial: "/nmod trial"
    setup: "/nmod setup <chave>"
    status: "/nmod status"
    mode: "/nmod mode"
    preset: "/nmod preset"
    word: "/nmod word"
    url: "/nmod url"
    allow: "/nmod allow"
    action: "/nmod action"
    surface: "/nmod surface"
    discord: "/nmod discord"
    test: "/nmod test badword"
    doctor: "/nmod doctor"
    cases: "/nmod cases"
    mute: "/nmod mute <jogador>"
    unmute: "/nmod unmute <jogador>"
    usage: "/nmod usage"
    privacy: "/nmod privacy"
    key: "/nmod key"
    cloudmode: "/nmod cloudmode"
    reload: "/nmod reload"
    "on": "/nmod on"
    "off": "/nmod off"
  desc:
    trial: "o que fazem as verificações grátis na nuvem"
    setup: "conectar uma chave da nuvem"
    status: "o que está protegido agora"
    mode: "bloquear, ou só avisar a staff"
    preset: "o quanto a nuvem é rígida"
    word: "palavras proibidas"
    url: "links bloqueados"
    allow: "exceções que sempre valem"
    action: "o que acontece depois de um bloqueio"
    surface: "placas, livros, nomes de itens e comandos"
    discord: "mandar alertas para um canal do Discord"
    test: "testar uma mensagem sem risco"
    doctor: "achar problemas na configuração"
    cases: "o que foi pego, e de quem"
    mute: "silenciar um jogador por um tempo"
    unmute: "deixar um jogador silenciado falar de novo"
    usage: "créditos e limites da nuvem"
    privacy: "que dados vão para onde"
    key: "trocar ou tirar a chave da nuvem"
    cloudmode: "bloquear pelas decisões da nuvem, ou só avisar"
    reload: "recarregar a configuração e os textos"
    "on": "ligar a moderação"
    "off": "desligar a moderação"

setup:
  usage: "{prefix} {#muted}Rode {#brand}/{label} setup <chave>{#muted} com uma chave de {#brand}{url}{#muted}, ou {#brand}/{label} trial{#muted} para verificações grátis na nuvem."
  done: "{prefix} {#safe}Chave salva. {#muted}Confira com {#brand}/nmod doctor{#muted} e depois com {#brand}/nmod test hello{#muted}."

key:
  usage: "{prefix} {#muted}Use {#brand}/{label} key set <chave>{#muted} ou {#brand}/{label} key clear{#muted}."
  saved: "{prefix} {#safe}Chave salva. {#muted}Confira com {#brand}/nmod doctor{#muted}."
  cleared: "{prefix} {#muted}Chave removida. Agora só as regras locais funcionam."

trial:
  pending: "{prefix} {#muted}As verificações na nuvem já estão começando. Espere terminar."
  explain-title: "{prefix} {#brand}Verificações grátis na nuvem{#muted}, sem criar conta."
  explain-sends: "  {#muted}Cada mensagem do chat e imagem de mapa vai para a Neomechanical com o nome e o UUID do jogador para ser verificada. Mensagens e imagens não são guardadas nem usadas para treinamento."
  explain-monitor: "  {#muted}As decisões da nuvem só avisam a staff até você rodar {#brand}/nmod cloudmode enforce{#muted}. Suas listas de palavras continuam funcionando como agora."
  explain-terms: "  {#muted}Ao começar você aceita os termos em {#brand}{terms}{#muted}. A política de privacidade em {#brand}{privacy}{#muted} explica como as mensagens são tratadas."
  start-button: "  {#brand}[Começar as verificações grátis]"
  start-hover: "{#muted}Roda {command}"
  start-console: "  {#muted}Rode {#brand}{command}{#muted} para começar."
  configuration-changed: "{prefix} {#review}As configurações da nuvem mudaram enquanto as verificações começavam, então as suas foram mantidas. {#muted}Rode {#brand}/nmod trial{#muted} para vê-las."
  requesting: "{prefix} {#muted}Começando as verificações grátis na nuvem..."
  activated: "{prefix} {#safe}Seu teste de 14 dias na nuvem vale até {#text}{expires}{#safe}."
  free-activated: "{prefix} {#safe}As verificações grátis na nuvem estão ligadas: {#text}{dailyChecks}{#safe} verificações e {#text}{dailyImages}{#safe} imagens de mapas por dia, sem data de fim."
  busy-retrying: "{prefix} {#review}A Neomechanical está ocupada. {#muted}Tentando de novo em {#text}{seconds}{#muted} segundos..."
  busy: "{prefix} {#risk}A Neomechanical está ocupada agora. {#muted}Rode {#brand}/nmod trial start{#muted} de novo em alguns minutos."
  lifetime-limit: "{prefix} {#risk}Esta rede já usou seus inícios grátis na nuvem. {#muted}Crie uma conta grátis em {#brand}{url}{#muted} para ter uma chave e depois rode {#brand}/nmod setup <chave>{#muted}."
  cooldown: "{prefix} {#risk}Verificações grátis na nuvem começaram desta rede há pouco tempo. {#muted}Outro servidor pode começar em {#text}{date}{#muted}, ou crie agora uma conta grátis em {#brand}{url}{#muted}."
  free-closed: "{prefix} {#review}Novos planos grátis estão pausados por enquanto. {#muted}Servidores que já têm um continuam com ele. Crie uma conta grátis em {#brand}{url}{#muted} para usar as verificações na nuvem agora."
  free-offer: "{prefix} {#safe}Seu teste pode passar para o plano grátis: {#muted}verificações na nuvem todos os dias sem data de fim, com a mesma chave. Ao passar você aceita os termos em neomechanical.com/terms."
  free-offer-button: "  {#brand}[Passar para o plano grátis]"
  free-moving: "{prefix} {#muted}Passando o teste para o plano grátis..."
  free-moved: "{prefix} {#safe}Este servidor está no plano grátis: {#text}{dailyChecks}{#safe} verificações e {#text}{dailyImages}{#safe} imagens de mapas por dia, com a mesma chave."
  come-back: "{prefix} {#safe}Este servidor pode voltar uma vez com o plano grátis: {#muted}verificações na nuvem todos os dias sem data de fim, com uma chave nova. Ao voltar você aceita os termos em neomechanical.com/terms."
  come-back-button: "  {#brand}[Voltar com o plano grátis]"
  refused-free_plan_not_open: "{prefix} {#review}O plano grátis ainda não está aberto para este servidor. {#muted}Suas verificações na nuvem continuam funcionando como estão."
  refused-trial_ended: "{prefix} {#review}Este teste terminou. {#muted}Rode {#brand}/nmod trial start{#muted} para voltar com o plano grátis."
  refused-trial_claimed: "{prefix} {#muted}Este teste agora pertence a uma conta, e a chave dele é a chave dessa conta. Entre em {#brand}{url}{#muted} para gerenciá-lo."
  refused-install_mismatch: "{prefix} {#risk}Esta chave pertence a outro servidor. {#muted}Crie uma conta grátis em {#brand}{url}{#muted} para ter sua própria chave."
  refused-already_free_plan: "{prefix} {#safe}Este servidor já está no plano grátis. {#muted}Rode {#brand}/nmod trial status{#muted} para ver as verificações de hoje."
  refused-already_back: "{prefix} {#risk}Este servidor já voltou antes com o plano grátis. {#muted}Crie uma conta grátis em {#brand}{url}{#muted} para ter uma chave."
  refused-trial_revoked: "{prefix} {#risk}Este teste foi interrompido, então não pode voltar. {#muted}Crie uma conta grátis em {#brand}{url}{#muted} para ter uma chave."
  refused-trial_running: "{prefix} {#review}O teste ainda está ativo. {#muted}Rode {#brand}/nmod trial status{#muted} para passá-lo ao plano grátis e manter a chave."
  activated-monitor: "{prefix} {#muted}No começo, as decisões da nuvem só avisam a staff. Rode {#brand}/nmod cloudmode enforce{#muted} quando confiar nelas."
  moderation-off: "{prefix} {#review}A moderação está desligada, então nada é verificado ainda. {#muted}Rode {#brand}/nmod on{#muted} quando estiver pronto."
  already-claimed: "{prefix} {#risk}Este servidor já usou o teste grátis. {#muted}Crie uma conta grátis em {#brand}{url}{#muted} para ter uma chave."
  rate-limited: "{prefix} {#risk}Muitos testes foram começados desta rede hoje. {#muted}Tente de novo amanhã, ou cadastre-se em {#brand}{url}{#muted}."
  failed: "{prefix} {#risk}O teste não começou: {error}."
  status-failed: "{prefix} {#risk}Não foi possível ler o teste na nuvem: {error}."
  error:
    transport: "não foi possível falar com a Neomechanical"
    server: "o serviço de testes teve um erro"
    invalid-response: "o serviço de testes mandou uma resposta que esta versão não consegue ler"
    forbidden: "o serviço de testes não aceitou esta instalação"
    key-rejected: "a chave foi recusada"
    invalid-endpoint: "moderation.api.endpoint não é um endereço válido"
  status-no-key: "{prefix} {#muted}Ainda não há chave da nuvem. Rode {#brand}/nmod trial{#muted} para verificações grátis na nuvem."
  status-checking: "{prefix} {#muted}Verificando o plano da nuvem..."
  status-active: "{prefix} {#safe}Teste na nuvem até {#text}{expires}{#safe}. {#muted}Dias restantes: {#text}{days}"
