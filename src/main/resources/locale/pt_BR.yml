  status-caught-startup: "{prefix} {#muted}Pego pela nuvem desde o início: {#text}{count}"
  status-expired: "{prefix} {#risk}O teste na nuvem terminou em {#text}{expires}{#risk}. {#muted}As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis, depois uma chave, e rode {#brand}/nmod setup <chave>{#muted}."
  status-revoked: "{prefix} {#risk}O teste na nuvem foi interrompido. {#muted}As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis, depois uma chave, e rode {#brand}/nmod setup <chave>{#muted}."
  status-free-ended: "{prefix} {#risk}O plano grátis foi interrompido. {#muted}As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis, depois uma chave, e rode {#brand}/nmod setup <chave>{#muted}."
  status-credits: "{prefix} {#review}Os créditos do teste acabaram. {#muted}Mantenha-o primeiro em uma conta grátis e adicione créditos lá."
  status-standard: "{prefix} {#safe}Este servidor usa uma chave completa da Neomechanical. {#muted}Rode {#brand}/nmod usage{#muted} para ver os créditos."
  status-free: "{prefix} {#safe}Plano grátis. {#muted}Hoje: {#text}{checks}{#muted} de {#text}{dailyChecks}{#muted} verificações, {#text}{images}{#muted} de {#text}{dailyImages}{#muted} imagens de mapas. Elas recomeçam em {#text}{date}, {time} UTC{#muted}."
  status-free-capped: "{prefix} {#review}Plano grátis: as {dailyChecks} verificações na nuvem de hoje acabaram {#muted}até {#text}{date}, {time} UTC{#muted}. As regras locais continuam funcionando."
  status-free-claimed: "{prefix} {#safe}Plano grátis, na sua conta. {#muted}Hoje: {#text}{checks}{#muted} de {#text}{dailyChecks}{#muted} verificações, {#text}{images}{#muted} de {#text}{dailyImages}{#muted} imagens de mapas. Verificações além disso usam seus créditos pelo preço normal."
  status-free-claimed-over: "{prefix} {#safe}Plano grátis, na sua conta. {#muted}As {dailyChecks} verificações grátis de hoje acabaram, então as verificações usam seus créditos pelo preço normal até {#text}{date}, {time} UTC{#muted}."
  status-free-pending: "{prefix} {#review}Uma conta está sendo criada para este plano. {#muted}Confirme o e-mail com que ela foi criada para terminar."
  status-free-claim: "{prefix} {#muted}Mantenha-o em uma conta grátis para ver as verificações online e continuar verificando além do limite diário:"
  keep-button: "  {#brand}[Manter a moderação na nuvem]"
  keep-in-game: "  {#muted}Para mantê-lo em uma conta, rode {#brand}/nmod trial status{#muted} no jogo e clique em {#brand}[Manter a moderação na nuvem]{#muted}. Quem abrir o link primeiro fica com ele, por isso o link nunca aparece no log do servidor."
  create-account-button: "  {#brand}[Criar uma conta grátis]"
  keep-hover: "{#muted}Abre {url}"
  cta-button: "  {#brand}[Verificações grátis na nuvem]"
  cta-hover: "{#muted}Roda /nmod trial. Não precisa de conta."

cloud-plan:
  console-trial-ended: "O teste grátis na nuvem terminou em {date}. As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis em {url}, crie uma chave e rode /nmod setup <chave>."
  console-trial-revoked: "O teste na nuvem foi interrompido. As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis em {url}, crie uma chave e rode /nmod setup <chave>."
  console-free-ended: "O plano grátis foi interrompido. As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis em {url}, crie uma chave e rode /nmod setup <chave>."
  console-trial-credits: "Os créditos do teste grátis na nuvem acabaram. As regras locais continuam funcionando. Para adicionar créditos, mantenha primeiro o teste em uma conta grátis. Rode /nmod trial status no jogo e clique em [Manter a moderação na nuvem]."
  console-auth: "A moderação na nuvem recusou a chave de API. Crie ou troque a chave em {url} e rode /nmod setup <chave>."
  console-credits: "A moderação na nuvem está sem créditos. Adicione mais em {url} e rode /nmod test <mensagem>."
  console-free-held: "As verificações grátis na nuvem de hoje acabaram até {date}, {time} UTC. moderation.chat.failOpen está como false, então as mensagens não são enviadas até lá: os jogadores são avisados de que o filtro do chat não está respondendo. Mude para true para deixar o chat passar só com as regras locais enquanto isso."
  join-trial-ending: "{prefix} {#review}Seu teste grátis na nuvem termina em {#text}{date}{#review}. {#muted}{caught}Mantenha-o em uma conta grátis:"
  join-trial-ended: "{prefix} {#risk}O teste grátis na nuvem terminou em {#text}{date}{#risk}. {#muted}{caught}As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis, depois uma chave, e rode {#brand}/nmod setup <chave>{#muted}."
  join-trial-revoked: "{prefix} {#risk}O teste na nuvem foi interrompido. {#muted}{caught}As regras locais continuam funcionando. Para manter as verificações na nuvem, crie uma conta grátis, depois uma chave, e rode {#brand}/nmod setup <chave>{#muted}."
  join-trial-credits: "{prefix} {#review}Os créditos do teste grátis na nuvem acabaram. {#muted}{caught}As regras locais continuam funcionando. Mantenha o teste em uma conta grátis para adicionar mais:"
  join-free-offer: "{prefix} {#safe}Seu teste na nuvem pode passar para o plano grátis: {#muted}{caught}Verificações na nuvem todos os dias sem data de fim, com a mesma chave. Ao passar você aceita os termos em neomechanical.com/terms."
  join-come-back: "{prefix} {#safe}Seu teste na nuvem terminou, e este servidor pode voltar uma vez com o plano grátis: {#muted}{caught}Verificações na nuvem todos os dias sem data de fim. Ao voltar você aceita os termos em neomechanical.com/terms."
  caught-during-trial: "Pego pela nuvem durante o teste: {count}."
  caught-since-startup: "Pego pela nuvem desde o início: {count}."

